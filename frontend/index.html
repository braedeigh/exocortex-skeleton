<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#aba3b2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14101e" media="(prefers-color-scheme: dark)" />
    <title>Exocortex</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Theming: Flask (routes/spa.py _spa_response) injects
      `<script>window.THEME_OVERRIDES = {...}; ...</script>` immediately
      before `</head>` on every server-rendered load. The theming engine is
      the bundled src/theme/ module (the TS port of static/js/sky-theme.js);
      main.tsx calls initTheme() at module scope, which runs after <head> is
      parsed, so the overrides are always in place first (absent under
      `vite dev`, where the built-in defaults apply).
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
