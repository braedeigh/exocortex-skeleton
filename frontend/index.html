<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#aba3b2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14101e" media="(prefers-color-scheme: dark)" />
    <title>Exocortex</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Flask (routes/spa.py _spa_response) injects
      `<script>window.THEME_OVERRIDES = {...}; ...</script>` immediately
      before `</head>` on every server-rendered load — i.e. as the very last
      thing in <head>, after anything we put there ourselves. sky-theme.js
      must run *after* that assignment lands, so it's loaded here in <body>
      (a plain, non-module script — runs synchronously as the parser reaches
      it, ahead of the deferred `main.tsx` module below) rather than in
      <head>. Unmodified from the Flask skeleton (static/js/sky-theme.js):
      self-boots off window.THEME_OVERRIDES (falls back to `{}` if unset,
      e.g. under `vite dev`), sets --bg/--card-bg/--text/... on
      documentElement, and listens for postMessage 'theme-changed' itself.
    -->
    <script src="/static/js/sky-theme.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
