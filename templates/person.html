<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Person</title>
<style>
:root {
    --bg: #0d0d1a;
    --card-bg: #1a1a2e;
    --text: #f0e6d6;
    --text-muted: rgba(200, 190, 170, 0.5);
    --border: #2a2a4a;
    --accent: #7c5cbf;
    --accent-light: rgba(124, 92, 191, 0.15);
    --hm-empty: rgba(255, 255, 255, 0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

.container { max-width: 800px; margin: 0 auto; padding: 0 16px 32px; overflow-x: hidden; }

/* Sticky header */
.phdr {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 0 14px; border-bottom: 1px solid var(--border);
}
.back-link {
    display: inline-flex; align-items: center; min-height: 40px; padding: 0 4px;
    color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600;
}
.back-link:hover { color: var(--accent); }
.phdr-name { font-size: 22px; font-weight: 700; margin-top: 6px; }
.phdr-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--text-muted); }
.p-tag { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--accent-light); color: var(--accent); font-weight: 600; }
.phdr-dates { font-size: 13px; color: var(--text-muted); }
.phdr-actions { margin-top: 10px; }
.p-btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 40px;
    padding: 0 16px; border: 1px solid var(--accent); border-radius: 10px;
    background: var(--accent-light); color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer;
}
.p-btn:hover { background: var(--accent); color: #fff; }

/* Sections */
.p-section { padding: 18px 0; border-bottom: 1px solid var(--border); }
.p-section:last-child { border-bottom: none; }
.p-section-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin-bottom: 10px;
}
.p-body, .p-impression { font-size: 15px; line-height: 1.65; }
.p-body h1 { font-size: 20px; margin-bottom: 8px; }
.p-body h2 { font-size: 17px; margin-top: 18px; margin-bottom: 6px; }
.p-body h3 { font-size: 15px; margin-top: 14px; margin-bottom: 4px; }
.p-body hr, .p-impression hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.p-body p, .p-impression p { margin-bottom: 8px; }
.p-body code, .p-impression code { background: rgba(124, 92, 191, 0.15); padding: 1px 4px; border-radius: 3px; font-size: 13px; }
.p-body em, .p-impression em { font-style: italic; color: var(--text-muted); }
.p-body strong, .p-impression strong { font-weight: 700; }
.p-body blockquote, .p-impression blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-muted); margin: 8px 0; }
.p-body ul, .p-impression ul { padding-left: 20px; margin-bottom: 8px; }
.p-empty { font-size: 13px; color: var(--text-muted); font-style: italic; }

/* Facts section */
.pf-row {
    display: flex; align-items: center; min-height: 40px;
    padding: 6px 0; border-bottom: 1px solid var(--border);
    gap: 12px; cursor: pointer;
}
.pf-row:last-child { border-bottom: none; }
.pf-label {
    flex: 0 0 100px; font-size: 13px; font-weight: 600;
    color: var(--text-muted); text-transform: capitalize;
}
.pf-value {
    flex: 1; font-size: 14px; color: var(--text);
}
.pf-placeholder {
    flex: 1; font-size: 13px; color: var(--text-muted); font-style: italic;
}
.pf-row-editing { display: flex; align-items: center; min-height: 40px; padding: 6px 0; gap: 8px; }
.pf-input {
    flex: 1; min-height: 40px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text); font-size: 14px;
    font-family: inherit;
}
.pf-input:focus { border-color: var(--accent); outline: none; }
.pf-btn {
    min-height: 40px; min-width: 40px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--card-bg); color: var(--text); font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.pf-btn:hover { border-color: var(--accent); color: var(--accent); }
.pf-add-row {
    display: flex; align-items: center; min-height: 40px; padding: 6px 0;
    gap: 8px; border-top: 1px solid var(--border); margin-top: 4px;
}
.pf-add-btn {
    font-size: 13px; color: var(--accent); background: none; border: none;
    cursor: pointer; padding: 0; min-height: 40px; display: flex; align-items: center;
    font-family: inherit; font-weight: 600;
}
.pf-add-btn:hover { text-decoration: underline; }
.pf-key-input {
    flex: 0 0 100px; min-height: 40px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text); font-size: 14px;
    font-family: inherit;
}
.pf-key-input:focus { border-color: var(--accent); outline: none; }

/* Heat map */
.heatmap-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.heatmap-inner { display: inline-block; min-width: 100%; }
.hm-months { display: flex; gap: 3px; margin-bottom: 4px; }
.hm-month-col { width: 14px; font-size: 12px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
.heatmap-grid { display: flex; gap: 3px; }
.hm-week { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
.hm-cell { width: 14px; height: 14px; border-radius: 3px; cursor: pointer; }

/* Receipts */
.p-row {
    display: block; width: 100%; text-align: left; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; margin-bottom: 6px;
    color: var(--text); cursor: pointer; font-family: inherit; min-height: 40px; position: relative;
}
.p-row:hover { border-color: var(--accent); }
.p-row-date { font-size: 13px; font-weight: 600; color: var(--accent); }
.p-row-note { font-size: 13px; color: var(--text); }
.p-row-snip { display: block; font-size: 13px; color: var(--text-muted); margin-top: 2px; line-height: 1.45; }
.p-badge {
    float: right; font-size: 12px; font-weight: 700; color: var(--text-muted);
    background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px;
}
.p-subhead {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-muted); margin: 14px 0 6px;
}
.p-subhead:first-child { margin-top: 0; }
.p-row-cardview { color: var(--accent); font-weight: 600; text-align: center; }

#loading { padding: 24px 0; color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>
<div class="container">
    <div class="phdr">
        <a class="back-link" href="/journal-view">&larr; Journal</a>
        <div class="phdr-name" id="pName">&nbsp;</div>
        <div class="phdr-meta" id="pMeta"></div>
        <div class="phdr-actions">
            <button class="p-btn" id="openFileBtn" style="display:none">Open file</button>
        </div>
    </div>

    <div id="loading">Loading&hellip;</div>

    <div id="content" style="display:none">
        <div class="p-section" id="factsSection">
            <div class="p-section-title">Facts</div>
            <div id="factsBody"></div>
        </div>

        <div class="p-section">
            <div class="p-section-title">Impression</div>
            <div class="p-impression" id="impressionBody"></div>
            <div style="margin-top:10px">
                <button class="p-btn" id="regenBtn" onclick="regenerateImpression()">Regenerate impression</button>
            </div>
        </div>

        <div class="p-section">
            <div class="p-section-title">Activity</div>
            <div id="heatmapWrap"></div>
        </div>

        <div class="p-section">
            <div class="p-section-title">Story</div>
            <div class="p-body" id="storyBody"></div>
        </div>

        <div class="p-section">
            <div class="p-section-title">Receipts</div>
            <div id="receiptsList"></div>
        </div>
    </div>
</div>

<script>window.THEME_OVERRIDES = {{ theme_overrides_json|safe }};</script>
<script src="/static/js/sky-theme.js"></script>
<script src="{{ v_static('js/md.js') }}"></script>
<script src="{{ v_static('js/person.js') }}"></script>
<script>loadPerson();</script>
</body>
</html>
