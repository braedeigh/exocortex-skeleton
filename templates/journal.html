<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal</title>
<style>
:root {
    --bg: #0d0d1a;
    --card-bg: #1a1a2e;
    --text: #f0e6d6;
    --text-muted: rgba(200, 190, 170, 0.5);
    --border: #2a2a4a;
    --accent: #7c5cbf;
    --accent-light: rgba(124, 92, 191, 0.15);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

.container {
    display: flex; flex-direction: column; height: 100%; max-width: 800px; margin: 0 auto; padding: 0 16px;
}

/* Nav */
.nav {
    display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.nav button {
    background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px;
    cursor: pointer; font-size: 14px; color: var(--text); transition: all 0.12s;
}
.nav button:hover { border-color: var(--accent); color: var(--accent); }
.nav button:disabled { opacity: 0.3; cursor: default; }
.nav .date-label {
    font-size: 15px; font-weight: 700; flex: 1; text-align: center;
    cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background 0.12s;
}
.nav .date-label:hover { background: var(--accent-light); }
.nav .today-btn { font-size: 12px; color: var(--accent); }

/* Calendar overlay */
.calendar-overlay {
    display: none; position: absolute; top: 48px; left: 50%; transform: translateX(-50%);
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12); z-index: 20; padding: 12px; min-width: 280px;
}
.calendar-overlay.open { display: block; }
.cal-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
}
.cal-header button {
    background: none; border: none; cursor: pointer; font-size: 16px; color: var(--text-muted);
    padding: 4px 8px; border-radius: 4px;
}
.cal-header button:hover { background: var(--accent-light); color: var(--accent); }
.cal-header .cal-month { font-size: 14px; font-weight: 700; }
.cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center;
}
.cal-grid .cal-dow { font-size:12px; font-weight: 600; color: var(--text-muted); padding: 4px 0; }
.cal-grid .cal-day {
    font-size: 13px; padding: 6px 0; border-radius: 6px; cursor: default; color: var(--text-muted);
}
.cal-grid .cal-day.has-entry {
    color: var(--accent); font-weight: 700; cursor: pointer; background: var(--accent-light);
}
.cal-grid .cal-day.has-entry:hover { background: var(--accent); color: #fff; }
.cal-grid .cal-day.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.cal-grid .cal-day.selected { background: var(--accent); color: #fff; }
.cal-grid .cal-day.empty { visibility: hidden; }

/* Dev-notes modal (journal tab) — same pattern as the terminal notes panel */
.devnotes-overlay {
    display: none; position: absolute; top: 48px; right: 0; z-index: 21;
    background: var(--card-bg); border: 1px solid rgba(124, 92, 191, 0.5); border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35); padding: 10px; width: min(320px, 86vw);
}
.devnotes-overlay.open { display: block; }
.devnotes-row { display: flex; gap: 6px; align-items: flex-start; }
.devnotes-row textarea {
    flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit; resize: none; outline: none;
}
.devnotes-row button {
    min-height: 40px; padding: 0 14px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
}
.devnotes-list { max-height: 40vh; overflow-y: auto; margin-top: 8px; font-size: 13px; color: var(--text); }

/* Mode toggle */
.mode-toggle {
    display: flex; gap: 0; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.mode-toggle button {
    flex: 1; padding: 8px 0; border: none; background: none; font-size: 13px; font-weight: 600;
    color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
}
.mode-toggle button.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Content area */
.content {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
}
.content textarea {
    flex: 1; width: 100%; border: none; outline: none; resize: none; padding: 16px 0;
    font-family: "SF Mono", Monaco, "Cascadia Code", Consolas, monospace; font-size: 14px;
    line-height: 1.7; color: var(--text); background: var(--bg);
}
.preview {
    flex: 1; overflow-y: auto; padding: 16px 0; line-height: 1.7; font-size: 15px; display: none;
}
.preview h1 { font-size: 22px; margin-bottom: 8px; }
.preview h2 { font-size: 18px; margin-top: 20px; margin-bottom: 6px; }
.preview h3 { font-size: 16px; margin-top: 16px; margin-bottom: 4px; }
.preview hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.preview p { margin-bottom: 8px; }
.preview code { background: rgba(124, 92, 191, 0.15); padding: 1px 4px; border-radius: 3px; font-size: 13px; }
.preview em { font-style: italic; color: var(--text-muted); }
.preview strong { font-weight: 700; }
.preview blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-muted); margin: 8px 0; }
.preview ul, .preview ol { padding-left: 20px; margin-bottom: 8px; }
/* Known people, auto-highlighted in read mode — click to jump to their file. */
.preview .entity { color: var(--accent); cursor: pointer; border-bottom: 1px dotted var(--accent); }
.preview .entity:hover { background: var(--accent-light); }
.preview .entity.find-current { background: var(--accent); color: #fff !important; border-radius: 3px; border-bottom-color: transparent; }

/* Find bar — lands on the first mention of a name in an entry, shows "n of N" */
.find-bar {
    display: none; position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 30;
    align-items: center; gap: 8px; background: var(--card-bg); border: 1px solid var(--accent);
    border-radius: 10px; padding: 6px 8px 6px 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); font-size: 14px;
}
.find-bar.open { display: flex; }
.find-bar .find-name { font-weight: 700; color: var(--accent); }
.find-bar .find-count { color: var(--text-muted); font-size: 13px; }
.find-bar button {
    min-width: 34px; min-height: 34px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 15px; cursor: pointer;
}
.find-bar button:hover { border-color: var(--accent); }

/* Entity backlinks popover */
.entity-pop-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
.entity-pop-backdrop.open { display: block; }
.entity-pop {
    display: none; position: fixed; z-index: 41;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(440px, 92vw); max-height: 80vh; overflow-y: auto;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5); padding: 0;
}
.entity-pop.open { display: block; }
/* Sticky header: name stays pinned if the (now short) body ever needs to scroll. */
.ep-sticky {
    position: sticky; top: 0; z-index: 2; background: var(--card-bg);
    padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
}
.ep-body { padding: 12px 16px 16px; }
.ep-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.ep-name { font-size: 19px; font-weight: 700; flex-shrink: 0; }
.ep-aliases {
    flex: 1; min-width: 0; font-size: 13px; color: var(--text-muted); font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ep-close {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    width: 36px; height: 36px; font-size: 20px; color: var(--text); cursor: pointer; flex-shrink: 0;
}
.ep-close:hover { background: var(--bg); }
.ep-blurb { font-size: 14px; line-height: 1.6; color: var(--text); margin-bottom: 12px; }
.ep-daterange { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
.ep-openperson {
    display: block; width: 100%; text-align: center; margin: 4px 0 8px; min-height: 44px;
    background: var(--accent); border: none; border-radius: 10px;
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
}
.ep-row {
    display: block; width: 100%; text-align: left; background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; margin-bottom: 6px;
    color: var(--text); cursor: pointer; font-family: inherit; min-height: 40px;
}
.ep-row:hover { border-color: var(--accent); }
.ep-date { font-size: 13px; font-weight: 600; color: var(--accent); }
.ep-snip {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; font-size: 13px; color: var(--text-muted); margin-top: 2px; line-height: 1.45;
}
.ep-empty { font-size: 13px; color: var(--text-muted); font-style: italic; }
/* Facts in entity popover */
.ep-facts { margin-bottom: 8px; }
.ep-fact-row { display: grid; grid-template-columns: 90px 1fr; gap: 8px; padding: 4px 0; font-size: 13px; }
.ep-fact-row:not(:last-child) { border-bottom: 1px solid var(--border); }
.ep-fact-label { font-weight: 600; color: var(--text-muted); }
.ep-fact-val { color: var(--text); }
.ep-fact-empty { color: var(--text-muted); opacity: 0.55; }

.save-status {
    padding: 6px 0; font-size: 12px; color: var(--text-muted); text-align: right; flex-shrink: 0; min-height: 24px;
}
</style>
</head>
<body>
<div class="container">
    <div class="nav" style="position:relative">
        <button id="prevBtn" onclick="nav(-1)">&larr;</button>
        <span class="date-label" id="dateLabel" onclick="toggleCalendar()"></span>
        <button id="todayBtn" class="today-btn" onclick="goToday()" style="display:none">Today</button>
        <button id="nextBtn" onclick="nav(1)">&rarr;</button>
        <button id="devNotesBtn" onclick="toggleDevNotes()" title="Journal dev notes" style="display:none">&#128221;</button>
        <div class="calendar-overlay" id="calOverlay"></div>
        <div class="devnotes-overlay" id="devNotesPanel">
            <div class="devnotes-row">
                <textarea id="devNoteInput" rows="2" placeholder="Bug or idea for the journal&hellip;"></textarea>
                <button onclick="addDevNote()">Add</button>
            </div>
            <div class="devnotes-list" id="devNotesList"></div>
        </div>
    </div>
    <div class="mode-toggle">
        <button class="active" id="readBtn" onclick="setMode('read')">Read</button>
        <button id="editBtn" onclick="setMode('edit')">Edit</button>
    </div>
    <!-- Empty today → start the page yourself, no keeper required -->
    <div id="startDay" style="display:none;padding:10px 0">
        <button onclick="startToday()" style="width:100%;min-height:44px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-light);color:var(--accent);font-size:15px;font-weight:600;cursor:pointer">&#9999;&#65039; Start today's page</button>
    </div>
    <div class="content">
        <textarea id="editor" spellcheck="false"></textarea>
        <div class="preview" id="preview"></div>
    </div>
    <div class="save-status" id="status"></div>
</div>

<!-- Entity backlinks popover: click a highlighted name -> blurb + everywhere it's stored -->
<div class="entity-pop-backdrop" id="entityBackdrop"></div>
<div class="entity-pop" id="entityPop" role="dialog" aria-modal="true"></div>

<!-- Find bar: after jumping to a referenced day, land on the first mention and cycle them -->
<div class="find-bar" id="findBar">
    <span class="find-name" id="findName"></span>
    <span class="find-count" id="findCount"></span>
    <button onclick="findNext(-1)" aria-label="Previous mention">&uarr;</button>
    <button onclick="findNext(1)" aria-label="Next mention">&darr;</button>
    <button onclick="closeFind()" aria-label="Close find">&times;</button>
</div>

<script>window.THEME_OVERRIDES = {{ theme_overrides_json|safe }};</script>
<script src="/static/js/sky-theme.js"></script>
<script src="{{ v_static('js/md.js') }}"></script>
<script src="{{ v_static('js/mini-notes.js') }}"></script>
<script>
let currentDate = null;
let saveTimer = null;
let lastSaved = '';
let journalDates = new Set();
let calMonth = null;
let calOpen = false;

const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const calOverlay = document.getElementById('calOverlay');

// --- Entity highlighting: known people light up in read mode, each their own
// color, click to jump to their file in the exocortex. ---
let _entityRe = null;                 // one big \b(term|term|...)\b matcher, or null
const _entityPath = new Map();        // person slug -> people-file path
const _matchToSlug = new Map();       // matched term (name/alias, lowercased) -> slug
let _popoverKey = null;               // whose popover is open (for find-on-jump)

// entityHue() and mdToHtml() now live in md.js (shared with person.html).

function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

async function loadEntities() {
    try {
        const resp = await fetch('/api/people');
        const data = await resp.json();
        const terms = [];
        const addTerm = (term, slug) => {
            const t = (term || '').trim();
            const k = t.toLowerCase();
            if (!k || _matchToSlug.has(k)) return;   // first person to claim a term wins
            _matchToSlug.set(k, slug);
            terms.push(t);
        };
        for (const p of (data.people || [])) {
            _entityPath.set(p.id, p.file);
            addTerm(p.name.split(' ')[0], p.id);     // first name as written in prose
            (p.aliases || []).forEach(a => addTerm(a, p.id));  // "my landlord" -> sally
        }
        if (terms.length) {
            // Longest first so multi-word aliases win; word-boundary, case-insensitive.
            terms.sort((a, b) => b.length - a.length);
            _entityRe = new RegExp('\\b(' + terms.map(escapeRe).join('|') + ')\\b', 'gi');
        }
    } catch (e) { /* highlighting is a nicety — never break the page over it */ }
}

// Walk the rendered preview's text nodes and wrap known names in clickable spans.
// Done on the DOM (not the markdown string) so we never corrupt tags/attributes.
function highlightEntities() {
    if (!_entityRe) return;
    const walker = document.createTreeWalker(preview, NodeFilter.SHOW_TEXT, {
        acceptNode(n) {
            // Don't highlight inside code, headings, or an already-made entity span.
            return n.parentElement && n.parentElement.closest('code, h1, h2, h3, .entity')
                ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
        }
    });
    const targets = [];
    let node;
    while ((node = walker.nextNode())) {
        _entityRe.lastIndex = 0;
        if (_entityRe.test(node.nodeValue)) targets.push(node);
    }
    for (const n of targets) {
        const text = n.nodeValue;
        const frag = document.createDocumentFragment();
        let last = 0, m;
        _entityRe.lastIndex = 0;
        while ((m = _entityRe.exec(text))) {
            if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
            const slug = _matchToSlug.get(m[0].toLowerCase());
            if (slug) {
                const span = document.createElement('span');
                span.className = 'entity';
                span.dataset.name = slug;                 // group name + aliases under one person
                span.dataset.path = _entityPath.get(slug) || '';
                span.style.color = `hsl(${entityHue(slug)} 70% 66%)`;   // consistent color per person
                span.style.borderBottomColor = `hsl(${entityHue(slug)} 70% 66%)`;
                span.textContent = m[0];
                frag.appendChild(span);
            } else {
                frag.appendChild(document.createTextNode(m[0]));
            }
            last = m.index + m[0].length;
        }
        if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
        n.parentNode.replaceChild(frag, n);
    }
}

let _journalServerDate = null;

function localToday() {
    if (_journalServerDate) return _journalServerDate;
    const n = new Date();
    return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}

async function fetchServerDate() {
    try {
        const resp = await fetch('/api/data');
        const data = await resp.json();
        if (data.server_date) _journalServerDate = data.server_date;
    } catch(e) {}
}

// --- Data loading ---
async function loadDates() {
    const resp = await fetch('/api/journal/dates');
    const data = await resp.json();
    journalDates = new Set(data.dates);
}

async function loadDate(date) {
    if (editor.value !== lastSaved && currentDate) await save();
    if (!date) date = localToday();
    try {
        const resp = await fetch(`/api/journal/${date}`);
        const data = await resp.json();
        if (data.error) { status.textContent = 'Error: ' + data.error; return; }
        currentDate = data.date;
        editor.value = data.content;
        lastSaved = data.content;
        // Offer to seed today's page when it doesn't exist yet.
        const sd = document.getElementById('startDay');
        if (sd) sd.style.display = (data.date === localToday() && !data.content.trim()) ? '' : 'none';
        document.getElementById('dateLabel').textContent = formatDate(data.date);
        document.getElementById('prevBtn').disabled = !data.prev;
        document.getElementById('prevBtn').dataset.date = data.prev || '';
        const nextBtn = document.getElementById('nextBtn');
        nextBtn.disabled = !data.next;
        nextBtn.dataset.date = data.next || '';
        // Most recent day: the → is dead anyway — swap it for the dev-notes 📝
        nextBtn.style.display = data.next ? '' : 'none';
        document.getElementById('devNotesBtn').style.display = data.next ? 'none' : '';
        document.getElementById('todayBtn').style.display = data.date === localToday() ? 'none' : '';
        renderPreview();
        closeCalendar();
        status.textContent = '';
    } catch(e) {
        status.textContent = 'Load error';
    }
}

function formatDate(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

function nav(dir) {
    const btn = dir === -1 ? document.getElementById('prevBtn') : document.getElementById('nextBtn');
    if (btn.dataset.date) loadDate(btn.dataset.date);
}

function goToday() { loadDate(null); }

// Seed today's page with the standard header (what the keeper would write)
// so a journal day can start without a keeper session.
function startToday() {
    editor.value = `# ${currentDate}\n\n\`B = Bradie | K = Keeper\`\n\n---\n\n`;
    document.getElementById('startDay').style.display = 'none';
    setMode('edit');
    save();
    editor.focus();
    editor.setSelectionRange(editor.value.length, editor.value.length);
}

// --- Edit / Read toggle ---
function setMode(mode) {
    document.getElementById('editBtn').classList.toggle('active', mode === 'edit');
    document.getElementById('readBtn').classList.toggle('active', mode === 'read');
    editor.style.display = mode === 'edit' ? 'block' : 'none';
    preview.style.display = mode === 'read' ? 'block' : 'none';
    if (mode === 'read') renderPreview();
}

function renderPreview() {
    const md = editor.value;
    if (!md.trim()) { preview.innerHTML = '<p style="color:var(--text-muted);font-style:italic">No entry for this day.</p>'; return; }
    preview.innerHTML = mdToHtml(md);
    highlightEntities();
}

// --- Entity backlinks popover: click a name -> blurb + everywhere it's stored ---
const entityPop = document.getElementById('entityPop');
const entityBackdrop = document.getElementById('entityBackdrop');

function epEsc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

preview.addEventListener('click', (e) => {
    const span = e.target.closest('.entity[data-name]');
    if (span) openEntityPopover(span.dataset.name);
});

async function openEntityPopover(name) {
    _popoverKey = name;   // remember who this popover is about, for find-on-jump
    entityPop.innerHTML = `<div class="ep-blurb">Loading…</div>`;
    entityPop.classList.add('open');
    entityBackdrop.classList.add('open');
    try {
        const resp = await fetch('/api/backlinks?name=' + encodeURIComponent(name));
        const data = await resp.json();
        renderEntityPopover(data);
    } catch (e) {
        entityPop.innerHTML = `<div class="ep-blurb">Couldn't load backlinks.</div>`;
    }
}

// "Mon YYYY" — e.g. "Feb 2026" — for the popover/person-page date ranges.
function monthYear(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
}

// A facts card sized to fit WITHOUT scrolling: name + aliases + known-since
// range on one line, the fact fields (seeds always shown, '—' when unfilled;
// edit them on the person page), 3 recent mentions as 2-line name-centered
// snippets, and the person-page button. Everything else lives on the page.
function renderEntityPopover(data) {
    const p = data.person;
    const stats = data.stats || {};
    const slug = (p && p.id) || (data.name || '').toLowerCase().split(' ')[0];
    const hue = entityHue(slug);
    const color = `hsl(${hue} 70% 66%)`;

    // Name line: aliases right next to the name, known-since range after; no tags.
    let aliases = '';
    if (p && p.aliases && p.aliases.length) {
        aliases = `<span class="ep-aliases">${epEsc(p.aliases.join(', '))}</span>`;
    }
    let range = '';
    if (stats.first_date && stats.last_date) {
        range = `<span class="ep-daterange">${monthYear(stats.first_date)} &ndash; ${monthYear(stats.last_date)}</span>`;
    }

    // Facts card: the four seed fields always render ('—' when unfilled, as a
    // nudge that the person page can fill them); extra saved facts follow.
    let factsHtml = '';
    if (p) {
        const SEEDS = ['relationship', 'age', 'lives', 'work'];
        const facts = p.facts || {};
        const rows = [];
        for (const k of SEEDS) {
            const v = (facts[k] || '').trim();
            rows.push([k, v]);
        }
        for (const [k, v] of Object.entries(facts)) {
            if (!SEEDS.includes(k) && v && v.trim()) rows.push([k, v.trim()]);
        }
        factsHtml = '<div class="ep-facts">' +
            rows.map(([k, v]) =>
                `<div class="ep-fact-row"><span class="ep-fact-label">${epEsc(k.charAt(0).toUpperCase() + k.slice(1))}</span>` +
                `<span class="ep-fact-val${v ? '' : ' ep-fact-empty'}">${v ? epEsc(v) : '&mdash;'}</span></div>`
            ).join('') +
            '</div>';
    }

    let body = '';
    // The 3 most recent mentions, 2-line clamped, name-centered snippets —
    // journal dates jump in-app, others open in keeper.
    for (const m of (data.mentions || []).slice(0, 3)) {
        const nav = (m.file && m.file.startsWith('Journal/Daily/') && m.date)
            ? `journal:${m.date}` : `keeper:${epEsc(m.file || '')}`;
        body += `<button class="ep-row" data-nav="${nav}">
            <span class="ep-date">${epEsc(m.label || m.date)}</span>
            ${m.snippet ? `<span class="ep-snip">${epEsc(m.snippet)}</span>` : ''}
        </button>`;
    }

    if (!body) {
        body = `<div class="ep-empty">No references recorded yet.</div>`;
    }
    if (!p) {
        body += `<div class="ep-empty">No file yet.</div>`;
    }

    const openPersonBtn = p
        ? `<button class="ep-openperson" onclick="location.href='/person/${epEsc(p.id)}'">Open person page &rarr;</button>` : '';

    entityPop.innerHTML = `
        <div class="ep-sticky">
            <div class="ep-head">
                <span class="ep-name" style="color:${color}">${epEsc(data.name)}</span>
                ${aliases}
                ${range}
                <button class="ep-close" onclick="closeEntityPopover()" aria-label="Close">&times;</button>
            </div>
        </div>
        <div class="ep-body">
            ${factsHtml}
            ${body}
            ${openPersonBtn}
        </div>`;
}

// Route clicks inside the popover: journal dates load in-app, other files open keeper.
entityPop.addEventListener('click', (e) => {
    const el = e.target.closest('[data-nav]');
    if (!el) return;
    const nav = el.dataset.nav;
    const idx = nav.indexOf(':');
    const kind = nav.slice(0, idx), val = nav.slice(idx + 1);
    closeEntityPopover();
    if (kind === 'journal') {
        // Jump to that day, then land on the first mention of this person + count them.
        const who = _popoverKey;
        setMode('read');
        loadDate(val).then(() => findInEntry(who));
    } else if (kind === 'keeper') {
        // Ask the app shell to open the Files tab (keeper memory) on this file.
        // Fall back to a direct nav if we're ever loaded outside the shell.
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'open-keeper', path: val }, location.origin);
        } else {
            location.href = '/keeper#' + encodeURIComponent(val);
        }
    }
});

function closeEntityPopover() {
    entityPop.classList.remove('open');
    entityBackdrop.classList.remove('open');
}
entityBackdrop.addEventListener('click', closeEntityPopover);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeEntityPopover(); closeFind(); } });

// --- Find-in-entry: after jumping to a referenced day, land on the first mention
// of that person and let her cycle through the rest, search-style ("2 of 5"). ---
const findBar = document.getElementById('findBar');
let _findMatches = [];
let _findIdx = 0;

function findInEntry(key) {
    closeFind();
    if (!key) return;
    setMode('read');
    // The name is already wrapped as .entity[data-name="key"] spans by the highlighter.
    _findMatches = Array.from(preview.querySelectorAll('.entity')).filter(el => el.dataset.name === key);
    if (!_findMatches.length) return;   // referenced by role only (e.g. "my landlord") — nothing to land on
    document.getElementById('findName').textContent = _findMatches[0].textContent;
    showFindMatch(0);
    findBar.classList.add('open');
}

function showFindMatch(i) {
    _findMatches.forEach(el => el.classList.remove('find-current'));
    const el = _findMatches[i];
    if (!el) return;
    el.classList.add('find-current');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    document.getElementById('findCount').textContent = `${i + 1} of ${_findMatches.length}`;
    _findIdx = i;
}

function findNext(dir) {
    if (!_findMatches.length) return;
    showFindMatch((_findIdx + dir + _findMatches.length) % _findMatches.length);
}

function closeFind() {
    findBar.classList.remove('open');
    _findMatches.forEach(el => el.classList.remove('find-current'));
    _findMatches = [];
}

// --- Auto-save ---
editor.addEventListener('input', () => {
    clearTimeout(saveTimer);
    status.textContent = 'Unsaved...';
    saveTimer = setTimeout(save, 1500);
});

async function save() {
    if (editor.value === lastSaved) return;
    await fetch(`/api/journal/${currentDate}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: editor.value })
    });
    lastSaved = editor.value;
    status.textContent = 'Saved';
    setTimeout(() => { if (status.textContent === 'Saved') status.textContent = ''; }, 2000);
}

window.addEventListener('beforeunload', () => { if (editor.value !== lastSaved) save(); });

// --- Calendar ---
function toggleCalendar() {
    if (calOpen) { closeCalendar(); return; }
    calOpen = true;
    closeDevNotes();
    const d = new Date(currentDate + 'T12:00:00');
    calMonth = { year: d.getFullYear(), month: d.getMonth() };
    renderCalendar();
    calOverlay.classList.add('open');
}

function closeCalendar() {
    calOpen = false;
    calOverlay.classList.remove('open');
}

function calNav(dir) {
    calMonth.month += dir;
    if (calMonth.month < 0) { calMonth.month = 11; calMonth.year--; }
    if (calMonth.month > 11) { calMonth.month = 0; calMonth.year++; }
    renderCalendar();
}

function renderCalendar() {
    const { year, month } = calMonth;
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDow = (firstDay.getDay() + 6) % 7;
    const daysInMonth = lastDay.getDate();
    const today = localToday();
    const monthLabel = firstDay.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    let html = `<div class="cal-header">
        <button onclick="calNav(-1)">&larr;</button>
        <span class="cal-month">${monthLabel}</span>
        <button onclick="calNav(1)">&rarr;</button>
    </div><div class="cal-grid">`;
    ['M','T','W','T','F','S','S'].forEach(d => { html += `<div class="cal-dow">${d}</div>`; });
    for (let i = 0; i < startDow; i++) html += '<div class="cal-day empty"></div>';
    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const hasEntry = journalDates.has(dateStr);
        const isToday = dateStr === today;
        const isSelected = dateStr === currentDate;
        let cls = 'cal-day';
        if (hasEntry) cls += ' has-entry';
        if (isToday) cls += ' today';
        if (isSelected) cls += ' selected';
        const click = hasEntry ? `onclick="loadDate('${dateStr}')"` : '';
        html += `<div class="${cls}" ${click}>${day}</div>`;
    }
    html += '</div>';
    calOverlay.innerHTML = html;
}

document.addEventListener('click', (e) => {
    if (calOpen && !calOverlay.contains(e.target) && e.target.id !== 'dateLabel') {
        closeCalendar();
    }
});

// --- Dev notes modal (writes to the 'journal' tab of dev notes) ---
const devNotesPanel = document.getElementById('devNotesPanel');
const devNoteInput = document.getElementById('devNoteInput');
let devNotesOpen = false;

function toggleDevNotes() {
    if (devNotesOpen) { closeDevNotes(); return; }
    devNotesOpen = true;
    closeCalendar();
    devNotesPanel.classList.add('open');
    loadDevNotes();
    devNoteInput.focus();
}

function closeDevNotes() {
    devNotesOpen = false;
    devNotesPanel.classList.remove('open');
}

const journalNotes = createMiniNotes(document.getElementById('devNotesList'), 'journal');
function loadDevNotes() { journalNotes.load(); }

async function addDevNote() {
    const text = devNoteInput.value.trim();
    if (!text) return;
    const r = await fetch('/api/devnote/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tab: 'journal', text })
    });
    if (r.ok) { devNoteInput.value = ''; devNoteInput.style.height = 'auto'; loadDevNotes(); }
}

// Enter submits, Shift+Enter inserts a newline; auto-expand while typing
devNoteInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addDevNote(); }
});
devNoteInput.addEventListener('input', () => {
    devNoteInput.style.height = 'auto';
    devNoteInput.style.height = Math.min(devNoteInput.scrollHeight, 160) + 'px';
});
document.addEventListener('click', (e) => {
    if (devNotesOpen && !devNotesPanel.contains(e.target) && e.target.id !== 'devNotesBtn') {
        closeDevNotes();
    }
});

// --- Polling ---
let journalCodeVersion = null;
async function pollJournal() {
    try {
        // Auto-reload on code changes
        const vRes = await fetch('/api/version');
        const vData = await vRes.json();
        if (journalCodeVersion && vData.hash !== journalCodeVersion) { location.reload(); return; }
        journalCodeVersion = vData.hash;

        // Poll journal content
        if (!currentDate) return;
        if (document.activeElement === editor) return;
        const resp = await fetch(`/api/journal/${currentDate}`);
        const data = await resp.json();
        if (data.content !== lastSaved) {
            editor.value = data.content;
            lastSaved = data.content;
            renderPreview();
        }
    } catch(e) {}
}
setInterval(pollJournal, 3000);

// --- Init ---
// Honor a ?date=YYYY-MM-DD deep link (e.g. from the person page's heat map)
// in place of the default "today" load.
function initialDateFromQuery() {
    return new URLSearchParams(location.search).get('date') || null;
}

setMode('read');
loadEntities().then(() => { if (preview.style.display !== 'none') renderPreview(); });
fetchServerDate().then(() => loadDates()).then(() => loadDate(initialDateFromQuery()));
</script>
