<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideas</title>
<style>
:root {
    --bg: #0d0d1a;
    --card-bg: #16162a;
    --text: #f0e6d6;
    --text-muted: rgba(200, 190, 170, 0.5);
    --border: #2a2a4a;
    --accent: #7c5cbf;
    --accent-light: rgba(124, 92, 191, 0.15);
    --green: #3a9e8c;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

.container { display: flex; flex-direction: column; height: 100%; max-width: 860px; margin: 0 auto; padding: 0 16px; }

/* Header */
.nav { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.nav .title { font-size: 16px; font-weight: 700; flex: 1; }
.nav .title small { font-weight: 400; color: var(--text-muted); font-size: 12px; margin-left: 8px; }
.mode-toggle { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.mode-toggle button {
    background: none; border: none; padding: 8px 16px; min-height: 40px;
    cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-muted);
}
.mode-toggle button.active { background: var(--accent); color: #fff; }

/* TOC */
.toc { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; flex-shrink: 0; }
.toc button {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    color: var(--text-muted); font-size: 12px; padding: 6px 12px; min-height: 32px; cursor: pointer;
    max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.toc button:hover { border-color: var(--accent); color: var(--text); }
.toc button.inbox { border-color: var(--green); color: var(--green); font-weight: 600; }
.toc button .count { opacity: 0.8; margin-left: 4px; }

/* Content */
.content { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px; }
#editor {
    width: 100%; height: 100%; background: none; border: none; outline: none; resize: none;
    color: var(--text); font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; line-height: 1.55;
    display: none; padding: 12px 0;
}
.doc-title { font-size: 22px; font-weight: 700; margin: 14px 0 4px; }
.preamble { color: var(--text-muted); font-size: 14px; margin-bottom: 10px; }

.idea-section {
    background: var(--card-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 10px; margin: 10px 0; overflow: hidden;
}
.idea-section.inbox-section { border-left-color: var(--green); }
.idea-section summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; font-size: 15px; font-weight: 600; min-height: 44px;
}
.idea-section summary::-webkit-details-marker { display: none; }
.idea-section summary .arrow { font-size: 11px; transition: transform 0.15s; color: var(--text-muted); flex-shrink: 0; }
.idea-section[open] summary .arrow { transform: rotate(90deg); }
.idea-section summary .count {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    background: var(--bg); border-radius: 10px; padding: 1px 8px; margin-left: auto; flex-shrink: 0;
}
.idea-section .body { padding: 0 16px 14px; font-size: 14px; line-height: 1.55; }

/* Rendered markdown */
.body h3, .preamble h3 { font-size: 14.5px; margin: 14px 0 6px; }
.body p { margin: 8px 0; }
.body ul { padding-left: 20px; margin: 8px 0; }
.body li { margin: 4px 0; }
.body code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
.body blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-muted); margin: 8px 0; }
.body a { color: var(--accent); }
.body hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.body strong { font-weight: 700; }

.save-status { padding: 6px 0; font-size: 12px; color: var(--text-muted); text-align: right; flex-shrink: 0; min-height: 24px; }
.empty-state { color: var(--text-muted); font-style: italic; padding: 24px 0; }
</style>
</head>
<body>
<div class="container">
    <div class="nav">
        <span class="title">&#128161; Ideas<small id="meta"></small></span>
        <div class="mode-toggle">
            <button class="active" id="readBtn" onclick="setMode('read')">Read</button>
            <button id="editBtn" onclick="setMode('edit')">Edit</button>
        </div>
    </div>
    <div class="toc" id="toc"></div>
    <div class="content" id="contentWrap">
        <textarea id="editor" spellcheck="false"></textarea>
        <div id="rendered"></div>
    </div>
    <div class="save-status" id="status"></div>
</div>

<script src="/static/js/sky-theme.js"></script>
<script>
const INBOX_TITLE = 'Inbox — sent from dev notes';
const editor = document.getElementById('editor');
const rendered = document.getElementById('rendered');
const statusEl = document.getElementById('status');
let lastSaved = '';
let saveTimer = null;
let mode = 'read';

// --- Markdown → HTML (same dialect as the journal preview, plus links) ---
function mdInline(s) {
    s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    return s;
}
function mdBlock(md) {
    const out = [];
    let list = null;      // open <ul> buffer
    let quote = null;     // open <blockquote> buffer
    const flushList = () => { if (list) { out.push('<ul>' + list.join('') + '</ul>'); list = null; } };
    const flushQuote = () => { if (quote) { out.push('<blockquote>' + quote.join('<br>') + '</blockquote>'); quote = null; } };
    for (const raw of md.split('\n')) {
        const line = raw.replace(/\s+$/, '');
        const li = line.match(/^\s*[-*] (.+)$/);
        const oli = line.match(/^\s*(\d+)\. (.+)$/);
        const q = line.match(/^> ?(.*)$/);
        const h3 = line.match(/^### (.+)$/);
        if (li || oli) {
            flushQuote();
            (list = list || []).push('<li>' + mdInline(li ? li[1] : oli[2]) + '</li>');
        } else if (q) {
            flushList();
            (quote = quote || []).push(mdInline(q[1]));
        } else if (h3) {
            flushList(); flushQuote();
            out.push('<h3>' + mdInline(h3[1]) + '</h3>');
        } else if (/^---+$/.test(line)) {
            flushList(); flushQuote();
            out.push('<hr>');
        } else if (!line.trim()) {
            flushList(); flushQuote();
        } else {
            flushList(); flushQuote();
            out.push('<p>' + mdInline(line) + '</p>');
        }
    }
    flushList(); flushQuote();
    return out.join('\n');
}

// --- Split the doc into preamble + ## sections (file order preserved) ---
function parseSections(md) {
    const lines = md.split('\n');
    const sections = [];
    let cur = { title: null, lines: [] };
    for (const line of lines) {
        const m = line.match(/^## (.+)$/);
        if (m) {
            sections.push(cur);
            cur = { title: m[1].trim(), lines: [] };
        } else {
            cur.lines.push(line);
        }
    }
    sections.push(cur);
    return sections;   // [0] = preamble (title:null), rest have titles
}

function sectionMeta(sec) {
    const bullets = sec.lines.filter(l => /^\s*[-*] /.test(l)).length;
    return bullets;
}

function render() {
    const md = editor.value;
    const toc = document.getElementById('toc');
    if (!md.trim()) {
        rendered.innerHTML = '<div class="empty-state">No ideas doc yet — send a dev note here with 💡, or hit Edit and start writing.</div>';
        toc.innerHTML = '';
        return;
    }
    const secs = parseSections(md);
    const pre = secs[0];
    let html = '';
    // Doc title (# line) + anything else before the first ## section.
    const preLines = pre.lines.slice();
    const tIdx = preLines.findIndex(l => /^# (.+)$/.test(l));
    if (tIdx !== -1) {
        html += '<div class="doc-title">' + mdInline(preLines[tIdx].replace(/^# /, '')) + '</div>';
        preLines.splice(tIdx, 1);
    }
    const preBody = preLines.join('\n').replace(/^-{3,}$/gm, '').trim();
    if (preBody) html += '<div class="preamble">' + mdBlock(preBody) + '</div>';

    let tocHtml = '';
    secs.slice(1).forEach((sec, i) => {
        const isInbox = sec.title === INBOX_TITLE;
        const n = sectionMeta(sec);
        const badge = n ? `<span class="count">${n}</span>` : '';
        const open = isInbox ? ' open' : '';
        html += `<details class="idea-section${isInbox ? ' inbox-section' : ''}" id="sec-${i}"${open}>
            <summary><span class="arrow">&#9654;</span><span>${mdInline(sec.title)}</span>${badge}</summary>
            <div class="body">${mdBlock(sec.lines.join('\n').trim())}</div>
        </details>`;
        tocHtml += `<button class="${isInbox ? 'inbox' : ''}" onclick="jumpTo(${i})" title="${sec.title.replace(/"/g, '&quot;')}">${mdInline(sec.title)}${n ? `<span class="count">${n}</span>` : ''}</button>`;
    });
    rendered.innerHTML = html;
    toc.innerHTML = tocHtml;
    document.getElementById('meta').textContent = `${secs.length - 1} sections`;
}

function jumpTo(i) {
    const el = document.getElementById('sec-' + i);
    if (!el) return;
    el.open = true;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// --- Modes ---
function setMode(m) {
    if (mode === 'edit' && m === 'read' && editor.value !== lastSaved) save();
    mode = m;
    document.getElementById('readBtn').classList.toggle('active', m === 'read');
    document.getElementById('editBtn').classList.toggle('active', m === 'edit');
    editor.style.display = m === 'edit' ? 'block' : 'none';
    rendered.style.display = m === 'read' ? 'block' : 'none';
    document.getElementById('toc').style.display = m === 'read' ? 'flex' : 'none';
    if (m === 'read') render();
}

// --- Load / save ---
async function load() {
    try {
        const resp = await fetch('/api/ideas');
        const data = await resp.json();
        editor.value = data.content || '';
        lastSaved = editor.value;
        render();
    } catch (e) {
        statusEl.textContent = 'Load error';
    }
}

editor.addEventListener('input', () => {
    clearTimeout(saveTimer);
    statusEl.textContent = 'Unsaved...';
    saveTimer = setTimeout(save, 1500);
});

async function save() {
    if (editor.value === lastSaved) return;
    const resp = await fetch('/api/ideas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: editor.value })
    });
    if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        statusEl.textContent = data.error || 'Save failed';
        return;
    }
    lastSaved = editor.value;
    statusEl.textContent = 'Saved';
    setTimeout(() => { if (statusEl.textContent === 'Saved') statusEl.textContent = ''; }, 2000);
}

window.addEventListener('beforeunload', () => { if (editor.value !== lastSaved) save(); });

// Re-pull when the page becomes visible again (a 💡-send may have landed),
// but never while she's mid-edit with unsaved changes.
document.addEventListener('visibilitychange', () => {
    if (!document.hidden && mode === 'read' && editor.value === lastSaved) load();
});

load();
</script>
</body>
</html>
