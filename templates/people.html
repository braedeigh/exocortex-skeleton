<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People</title>
<style>
:root {
    --bg: #0d0d1a;
    --card-bg: #1a1a2e;
    --text: #f0e6d6;
    --text-muted: rgba(200, 190, 170, 0.5);
    --border: #2a2a4a;
    --accent: #7c5cbf;
    --accent-light: rgba(124, 92, 191, 0.15);
    --hm-empty: rgba(255, 255, 255, 0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

.container { max-width: 800px; margin: 0 auto; padding: 0 16px 32px; overflow-x: hidden; }

/* Sticky header + controls, stacked together */
.phdr-wrap { position: sticky; top: 0; z-index: 5; background: var(--bg); }
.phdr { padding: 12px 0 10px; }
.phdr-name { font-size: 22px; font-weight: 700; margin-top: 6px; }

/* Controls row */
.controls-row {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px;
    border-bottom: 1px solid var(--border); -webkit-overflow-scrolling: touch;
}
.chip {
    flex-shrink: 0; display: inline-flex; align-items: center; min-height: 40px;
    padding: 0 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text); font-size: 13px; font-weight: 600;
    cursor: pointer; white-space: nowrap; font-family: inherit;
}
.chip.sort-chip { color: var(--accent); border-color: var(--accent); background: var(--accent-light); }
.chip.tag-chip.active { color: #fff; background: var(--accent); border-color: var(--accent); }
.chip-sep { flex-shrink: 0; width: 1px; background: var(--border); margin: 6px 2px; }

/* List */
#list { padding-top: 8px; }
.tier-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin: 18px 0 8px;
}
.tier-title:first-child { margin-top: 12px; }

.p-row-item {
    display: block; width: 100%; text-align: left; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    margin-bottom: 8px; color: var(--text); cursor: pointer; font-family: inherit;
    min-height: 56px;
}
.p-row-item:hover { border-color: var(--accent); }
.pr-line1 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.pr-name { font-size: 16px; font-weight: 600; color: var(--text); }
.pr-lastseen { font-size: 13px; color: var(--text-muted); flex-shrink: 0; white-space: nowrap; }
.pr-blurb {
    margin-top: 3px; font-size: 14px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pr-empty { font-size: 13px; color: var(--text-muted); font-style: italic; padding: 12px 0; }

/* Expanded content */
.pr-expanded { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); cursor: default; }
.pr-stats { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.pr-spark { width: 100%; height: 36px; display: block; margin-bottom: 10px; }
.p-tag { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--accent-light); color: var(--accent); font-weight: 600; margin: 0 6px 6px 0; display: inline-block; }
.pr-note { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 10px; }
.p-btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 40px;
    padding: 0 16px; border: 1px solid var(--accent); border-radius: 10px;
    background: var(--accent-light); color: var(--accent); font-size: 14px; font-weight: 600;
    cursor: pointer; text-decoration: none;
}
.p-btn:hover { background: var(--accent); color: #fff; }

#loading { padding: 24px 0; color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>
<div class="container">
    <div class="phdr-wrap">
        <div class="phdr">
            <div class="phdr-name">People</div>
        </div>
        <div class="controls-row" id="controlsRow"></div>
    </div>

    <div id="loading">Loading&hellip;</div>
    <div id="list" style="display:none"></div>
</div>

<script>window.THEME_OVERRIDES = {{ theme_overrides_json|safe }};</script>
<script src="/static/js/sky-theme.js"></script>
<script src="{{ v_static('js/people.js') }}"></script>
<script>loadPeopleRoster();</script>
</body>
</html>
