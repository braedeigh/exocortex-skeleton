<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keeper memory</title>
<style>
:root {
    --bg: #0d0d1a;
    --panel: #14142a;
    --text: #f0e6d6;
    --text-muted: rgba(200, 190, 170, 0.5);
    --border: #2a2a4a;
    --accent: #7c5cbf;
    --accent-light: rgba(124, 92, 191, 0.15);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

.container { display: flex; flex-direction: column; height: 100%; }

/* Top bar */
.topbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.topbar .home { color: var(--accent); text-decoration: none; font-size: 14px; min-height: 40px; display: flex; align-items: center; padding: 0 6px; }
.topbar .home:hover { text-decoration: underline; }
.topbar h1 { font-size: 16px; font-weight: 700; flex-shrink: 0; }
.topbar .search {
    flex: 1; max-width: 320px; margin-left: auto; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px; padding: 8px 12px; min-height: 40px; outline: none;
}
.topbar .search:focus { border-color: var(--accent); }
.menu-btn {
    display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 18px; min-height: 40px; min-width: 44px; cursor: pointer;
}

/* Main split */
.main { flex: 1; min-height: 0; display: flex; }

/* Sidebar tree */
.sidebar {
    width: 280px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg);
}
.group { border-bottom: 1px solid var(--border); }
.group > summary {
    list-style: none; cursor: pointer; padding: 11px 14px; font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted);
    display: flex; align-items: center; gap: 8px; min-height: 40px; user-select: none;
}
.group > summary::-webkit-details-marker { display: none; }
.group > summary:hover { color: var(--accent); }
.group > summary .chev { transition: transform 0.15s; font-size: 11px; }
.group[open] > summary .chev { transform: rotate(90deg); }
.group > summary .count { margin-left: auto; font-weight: 600; font-size: 12px; opacity: 0.7; }
.file-row {
    display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
    color: var(--text); font-size: 14px; padding: 9px 14px 9px 30px; min-height: 38px;
    border-left: 3px solid transparent; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.file-row:hover { background: var(--accent-light); }
.file-row.active { background: var(--accent-light); border-left-color: var(--accent); color: var(--accent); font-weight: 600; }
.file-row.hidden { display: none; }
.group.no-match { display: none; }

/* Content pane */
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pane-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.pane-head .filepath { font-size: 14px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane-head .filepath .dir { color: var(--text-muted); font-weight: 400; }
.mode-toggle { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.mode-toggle button {
    padding: 8px 16px; border: none; background: none; font-size: 13px; font-weight: 600;
    color: var(--text-muted); cursor: pointer; min-height: 40px;
}
.mode-toggle button.active { color: #fff; background: var(--accent); }

.content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.content textarea {
    flex: 1; width: 100%; border: none; outline: none; resize: none; padding: 18px 22px;
    font-family: "SF Mono", Monaco, "Cascadia Code", Consolas, monospace; font-size: 14px;
    line-height: 1.7; color: var(--text); background: var(--bg);
}
.preview { flex: 1; overflow-y: auto; padding: 18px 22px; line-height: 1.7; font-size: 15px; display: none; max-width: 820px; }
.preview h1 { font-size: 22px; margin: 4px 0 10px; }
.preview h2 { font-size: 18px; margin: 22px 0 6px; }
.preview h3 { font-size: 16px; margin: 16px 0 4px; }
.preview hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.preview p { margin-bottom: 8px; }
.preview code { background: var(--accent-light); padding: 1px 5px; border-radius: 3px; font-size: 13px; }
.preview em { font-style: italic; color: var(--text-muted); }
.preview strong { font-weight: 700; }
.preview blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-muted); margin: 8px 0; }
.preview ul, .preview ol { padding-left: 22px; margin-bottom: 8px; }
.preview li { margin-bottom: 3px; }
.preview .wikilink { color: var(--accent); cursor: pointer; border-bottom: 1px dotted var(--accent); }
.preview .wikilink.dead { color: var(--text-muted); border-bottom-style: dotted; cursor: default; opacity: 0.8; }
.preview .wikilink:hover:not(.dead) { background: var(--accent-light); }

.empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 15px; text-align: center; padding: 24px; }
.save-status { padding: 6px 16px; font-size: 12px; color: var(--text-muted); text-align: right; flex-shrink: 0; min-height: 24px; }

@media (max-width: 700px) {
    .menu-btn { display: block; }
    .topbar h1 { display: none; }
    .sidebar {
        position: absolute; top: 0; left: 0; bottom: 0; z-index: 30; width: 82%; max-width: 320px;
        transform: translateX(-100%); transition: transform 0.2s; box-shadow: 4px 0 24px rgba(0,0,0,0.4);
    }
    .sidebar.open { transform: translateX(0); }
    .scrim { display: none; position: absolute; inset: 0; z-index: 25; background: rgba(0,0,0,0.5); }
    .scrim.open { display: block; }
}
</style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()" aria-label="Files">&#9776;</button>
        <a href="/" class="home">&larr; App</a>
        <h1>Keeper memory</h1>
        <input class="search" id="search" type="search" placeholder="Search files…" oninput="filterTree(this.value)">
    </div>
    <div class="main">
        <div class="scrim" id="scrim" onclick="toggleSidebar()"></div>
        <nav class="sidebar" id="sidebar"></nav>
        <div class="pane">
            <div class="pane-head" id="paneHead" style="display:none">
                <span class="filepath" id="filepath"></span>
                <div class="mode-toggle">
                    <button class="active" id="readBtn" onclick="setMode('read')">Read</button>
                    <button id="editBtn" onclick="setMode('edit')">Edit</button>
                </div>
            </div>
            <div class="content">
                <div class="empty-state" id="emptyState">Pick a file to see what the keeper remembers.</div>
                <textarea id="editor" spellcheck="false" style="display:none"></textarea>
                <div class="preview" id="preview"></div>
            </div>
            <div class="save-status" id="status"></div>
        </div>
    </div>
</div>

<script src="/static/js/sky-theme.js"></script>
<script>
// --- State ---
let files = [];              // [{path, name, group, mtime}]
let byStem = new Map();      // lowercased stem -> path (for [[wikilinks]]; people/ wins)
let currentPath = null;
let lastSaved = '';
let saveTimer = null;

const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const sidebar = document.getElementById('sidebar');

// Friendly group labels + display order. Unknown groups fall to the end, alpha.
const GROUP_LABELS = {
    'Core': 'Core memory', 'people': 'People', 'Patterns': 'Patterns', 'context': 'Context',
    'tulku-diary': 'Keeper diary', 'Journal': 'Journal', 'Health': 'Health',
    'meetings': 'Meetings', 'manifestation': 'Manifestation', 'practices': 'Practices', 'research': 'Research',
};
const GROUP_ORDER = ['Core', 'people', 'Patterns', 'context', 'tulku-diary', 'Journal', 'Health'];
const DEFAULT_OPEN = new Set(['Core', 'people', 'Patterns']);
const DATE_RE = /^\d{4}-\d{2}-\d{2}/;

function groupRank(g) {
    const i = GROUP_ORDER.indexOf(g);
    return i === -1 ? GROUP_ORDER.length : i;
}

// --- Load the tree ---
async function loadTree() {
    const resp = await fetch('/api/keeper/tree');
    const data = await resp.json();
    files = data.files || [];

    // Build the stem index for wikilinks; prefer a people/ file when names collide.
    byStem = new Map();
    for (const f of files) {
        const k = f.name.toLowerCase();
        if (!byStem.has(k) || f.group === 'people') byStem.set(k, f.path);
    }
    renderTree();
}

function renderTree() {
    // Group the flat file list.
    const groups = {};
    for (const f of files) (groups[f.group] ||= []).push(f);

    const order = Object.keys(groups).sort((a, b) =>
        groupRank(a) - groupRank(b) || a.localeCompare(b));

    let html = '';
    for (const g of order) {
        const items = groups[g].sort((a, b) => {
            // Dated files (journal, diary) newest-first; everything else alpha.
            const ad = DATE_RE.test(a.name), bd = DATE_RE.test(b.name);
            if (ad && bd) return b.name.localeCompare(a.name);
            return a.name.localeCompare(b.name);
        });
        const open = lsOpen(g);
        html += `<details class="group" data-group="${g}" ${open ? 'open' : ''} ontoggle="rememberOpen('${g}', this.open)">
            <summary><span class="chev">&#9654;</span>${esc(GROUP_LABELS[g] || g)}<span class="count">${items.length}</span></summary>`;
        for (const f of items) {
            html += `<button class="file-row" data-path="${esc(f.path)}" data-search="${esc((f.path + ' ' + f.name).toLowerCase())}" onclick="openFile('${esc(f.path)}')">${esc(f.name)}</button>`;
        }
        html += `</details>`;
    }
    sidebar.innerHTML = html;
    markActive();
}

// Remember which groups are open across reloads.
function lsOpen(g) {
    const v = localStorage.getItem('keeper.open.' + g);
    return v === null ? DEFAULT_OPEN.has(g) : v === '1';
}
function rememberOpen(g, open) { localStorage.setItem('keeper.open.' + g, open ? '1' : '0'); }

// --- Open / load a file ---
async function openFile(path) {
    if (path === currentPath) { closeSidebarMobile(); return; }
    if (editor.value !== lastSaved && currentPath) await save();
    const resp = await fetch('/api/keeper/file?path=' + encodeURIComponent(path));
    const data = await resp.json();
    if (data.error) { status.textContent = 'Error: ' + data.error; return; }
    currentPath = data.path;
    editor.value = data.content;
    lastSaved = data.content;
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('paneHead').style.display = 'flex';
    setFilePathLabel(data.path);
    setMode('read');
    markActive();
    closeSidebarMobile();
    status.textContent = '';
    localStorage.setItem('keeper.last', path);
}

function setFilePathLabel(path) {
    const i = path.lastIndexOf('/');
    const el = document.getElementById('filepath');
    el.innerHTML = i === -1 ? esc(path)
        : `<span class="dir">${esc(path.slice(0, i + 1))}</span>${esc(path.slice(i + 1))}`;
}

function markActive() {
    sidebar.querySelectorAll('.file-row').forEach(b =>
        b.classList.toggle('active', b.dataset.path === currentPath));
    // Make sure the active file's group is open so it's visible.
    const active = sidebar.querySelector('.file-row.active');
    if (active) { const d = active.closest('.group'); if (d && !d.open) d.open = true; }
}

// --- Edit / Read toggle ---
function setMode(mode) {
    document.getElementById('readBtn').classList.toggle('active', mode === 'read');
    document.getElementById('editBtn').classList.toggle('active', mode === 'edit');
    editor.style.display = mode === 'edit' ? 'block' : 'none';
    preview.style.display = mode === 'read' ? 'block' : 'none';
    if (mode === 'read') renderPreview();
    else editor.focus();
}

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function renderPreview() {
    let md = editor.value;
    if (!md.trim()) { preview.innerHTML = '<p style="color:var(--text-muted);font-style:italic">Empty file.</p>'; return; }
    md = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // [[wikilinks]] — the keeper's cross-references. Resolve to a real file when we have one.
    md = md.replace(/\[\[([^\]]+)\]\]/g, (m, name) => {
        const key = name.trim().toLowerCase();
        const target = byStem.get(key);
        return target
            ? `<span class="wikilink" data-target="${esc(target)}">${esc(name)}</span>`
            : `<span class="wikilink dead" title="no file yet">${esc(name)}</span>`;
    });
    md = md.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    md = md.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    md = md.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    md = md.replace(/^---+$/gm, '<hr>');
    md = md.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    md = md.replace(/\*(.+?)\*/g, '<em>$1</em>');
    md = md.replace(/`([^`]+)`/g, '<code>$1</code>');
    md = md.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
    md = md.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
    md = md.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
    md = md.replace(/\n\n/g, '</p><p>');
    md = '<p>' + md + '</p>';
    md = md.replace(/<p><(h[123]|hr|ul|blockquote)/g, '<$1');
    md = md.replace(/<\/(h[123]|ul|blockquote)><\/p>/g, '</$1>');
    preview.innerHTML = md;
}

// Click a wikilink to jump to that memory file.
preview.addEventListener('click', (e) => {
    const link = e.target.closest('.wikilink[data-target]');
    if (link) openFile(link.dataset.target);
});

// --- Autosave (only ever fires in edit mode) ---
editor.addEventListener('input', () => {
    clearTimeout(saveTimer);
    status.textContent = 'Unsaved…';
    saveTimer = setTimeout(save, 1500);
});

async function save() {
    if (!currentPath || editor.value === lastSaved) return;
    const body = JSON.stringify({ path: currentPath, content: editor.value });
    const resp = await fetch('/api/keeper/file', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body,
    });
    if (!resp.ok) { status.textContent = 'Save failed'; return; }
    lastSaved = editor.value;
    status.textContent = 'Saved';
    setTimeout(() => { if (status.textContent === 'Saved') status.textContent = ''; }, 2000);
}

window.addEventListener('beforeunload', () => { if (editor.value !== lastSaved) save(); });

// --- Search filter ---
function filterTree(q) {
    q = q.trim().toLowerCase();
    sidebar.querySelectorAll('.group').forEach(group => {
        let any = false;
        group.querySelectorAll('.file-row').forEach(row => {
            const hit = !q || row.dataset.search.includes(q);
            row.classList.toggle('hidden', !hit);
            if (hit) any = true;
        });
        group.classList.toggle('no-match', !any);
        if (q && any) group.open = true;   // auto-expand groups with matches
    });
}

// --- Mobile sidebar ---
function toggleSidebar() {
    sidebar.classList.toggle('open');
    document.getElementById('scrim').classList.toggle('open', sidebar.classList.contains('open'));
}
function closeSidebarMobile() {
    sidebar.classList.remove('open');
    document.getElementById('scrim').classList.remove('open');
}

// --- Live reload on keeper writes / code changes (mirrors the journal page) ---
let codeVersion = null;
async function poll() {
    try {
        const v = await (await fetch('/api/version')).json();
        if (codeVersion && v.hash !== codeVersion) { location.reload(); return; }
        codeVersion = v.hash;
        // If the keeper edited the open file in a session, pull it in (unless she's typing).
        if (currentPath && document.activeElement !== editor) {
            const data = await (await fetch('/api/keeper/file?path=' + encodeURIComponent(currentPath))).json();
            if (!data.error && data.content !== lastSaved) {
                editor.value = data.content; lastSaved = data.content;
                if (preview.style.display !== 'none') renderPreview();
            }
        }
    } catch (e) {}
}
setInterval(poll, 4000);

// --- Init ---
loadTree().then(() => {
    const last = localStorage.getItem('keeper.last');
    if (last && files.some(f => f.path === last)) openFile(last);
});
</script>
</body>
</html>
