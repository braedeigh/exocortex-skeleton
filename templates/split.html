<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d1a">
<link rel="manifest" href="{{ v_static('manifest.json') }}">
<link rel="apple-touch-icon" href="{{ v_static('icon-192.png') }}">
<title>Exocortex</title>
<style>
:root {
    --bg: #0d0d1a;
    --border: #2a2a4a;
    --accent: #7c5cbf;
    --accent-glow: rgba(124, 92, 191, 0.3);
    --tab-bg: #1a1a2e;
    --tab-active: #7c5cbf;
    --text: #e0d0ff;
    --text-muted: rgba(180, 160, 220, 0.6);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; background: var(--bg); }
body { height: 100%; overflow: hidden; background: var(--bg); }

/* === DESKTOP SPLIT === */
.split-container {
    display: flex;
    height: 100%;
    width: 100%;
}
.pane {
    height: 100%;
    overflow: hidden;
    position: relative;
}
.pane iframe {
    width: 100%;
    height: 100%;
    border: none;
}
.pane-terminal iframe {
    flex: 1;
    min-height: 0;
}
.pane-terminal { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
.pane-dashboard { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
.pane-dashboard iframe { flex: 1; min-height: 0; }

/* Dashboard pane tab bar — matches session-bar style */
.dash-bar {
    display: flex;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.dash-bar button {
    flex: 1;
    /* Bumped padding so the bar height matches the session-bar, whose "+" button
       (font-size 18px) makes that side taller than the default 13px tab text. */
    padding: 11px 0;
    border: none;
    background: var(--tab-bg);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.15s;
    border-bottom: 3px solid transparent;
}
.dash-bar button.active {
    color: var(--text);
    background: var(--bg);
    border-bottom-color: var(--tab-active);
}
.dash-bar button:hover:not(.active) {
    color: var(--text);
    background: rgba(124, 92, 191, 0.1);
}
/* Close-vscode affordance on the Files tab; also reused for closing custom
   session tabs in the desktop session bar (hover-only, see .session-bar
   button:hover below). */
.dash-bar button, .tab-btn, .session-bar button { position: relative; }
.tab-close-x {
    position: absolute;
    top: 3px;
    right: 4px;
    font-size: 14px;
    line-height: 1;
    color: var(--text-muted);
    opacity: 0;
    padding: 2px 5px;
    border-radius: 4px;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
    cursor: pointer;
    user-select: none;
}
.dash-bar button:hover .tab-close-x,
.session-bar button:hover .tab-close-x { opacity: 0.55; }
.tab-close-x:hover {
    opacity: 1 !important;
    color: #e74c3c;
    background: rgba(231,76,60,0.12);
}
/* Touch devices: rely on long-press, hide the × */
@media (hover: none) {
    .tab-close-x { display: none; }
}
.tab-btn.long-pressing {
    background: rgba(231,76,60,0.18) !important;
    transition: background 0.6s ease;
}

/* Desktop session tabs */
.session-bar {
    display: flex;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.session-bar button {
    flex: 1;
    padding: 8px 0;
    border: none;
    background: var(--tab-bg);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.15s;
    border-bottom: 3px solid transparent;
}
.session-bar button.active {
    color: var(--text);
    background: var(--bg);
    border-bottom-color: var(--tab-active);
}
.session-bar button:hover:not(.active) {
    color: var(--text);
    background: rgba(124, 92, 191, 0.1);
}
.session-bar .add-session-btn {
    flex: 0 0 36px;
    font-size: 18px;
    color: var(--text-muted);
    background: var(--tab-bg);
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    border-bottom: 3px solid transparent;
    padding: 8px 0;
}
.session-bar .add-session-btn:hover {
    color: var(--text);
    background: rgba(124, 92, 191, 0.1);
}
/* Right-click context menu for closing custom tabs */
.ctx-menu {
    position: fixed;
    z-index: 9999;
    background: rgba(26, 26, 46, 0.95);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 0;
    min-width: 140px;
    display: none;
}
.ctx-menu.open { display: block; }
.ctx-menu button {
    display: block;
    width: 100%;
    padding: 8px 14px;
    border: none;
    background: transparent;
    color: #ff6b6b;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    letter-spacing: 0;
    text-transform: none;
    font-weight: 500;
}
.ctx-menu button:hover {
    background: rgba(255, 80, 80, 0.15);
}

/* Divider */
.divider {
    width: 6px;
    background: var(--border);
    cursor: col-resize;
    flex-shrink: 0;
    position: relative;
    transition: background 0.15s;
}
.divider:hover, .divider.active {
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
}
.divider::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 2px;
    height: 40px;
    background: rgba(255,255,255,0.2);
    border-radius: 1px;
}
.divider:hover::after, .divider.active::after {
    background: rgba(255,255,255,0.5);
}

/* === MOBILE TABS === */
.mobile-tabs {
    display: none;
    height: 100%;
    flex-direction: column;
}
.tab-bar {
    display: flex;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding-top: env(safe-area-inset-top);
}
.tab-btn {
    flex: 1;
    padding: 12px 0;
    border: none;
    background: var(--tab-bg);
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.15s;
    border-bottom: 3px solid transparent;
}
.tab-btn.active {
    color: var(--text);
    background: var(--bg);
    border-bottom-color: var(--tab-active);
}
.session-menu {
    display: none;
    position: absolute;
    top: calc(43px + env(safe-area-inset-top));
    left: 0;
    right: 0;
    z-index: 99;
    background: rgba(13, 13, 26, 0.95);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(124, 92, 191, 0.3);
}
.session-menu.open { display: flex; }
.session-btn {
    flex: 1;
    padding: 10px 0;
    border: none;
    background: transparent;
    color: rgba(124, 92, 191, 0.7);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 3px solid transparent;
}
.session-btn.active {
    color: var(--text);
    background: var(--bg);
    border-bottom-color: var(--tab-active);
}
.session-menu .add-session-btn {
    flex: 0 0 40px;
    font-size: 18px;
    color: rgba(124, 92, 191, 0.7);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 10px 0;
    border-bottom: 3px solid transparent;
}
/* Hide the purple bar on the Terminal tab when dropdown is open */
.tab-btn.menu-open {
    border-bottom-color: transparent;
}
.tab-content {
    flex: 1;
    position: relative;
    overflow: hidden;
    margin-top: calc(43px + env(safe-area-inset-top));
}
.tab-pane {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
}
.tab-pane.active { display: block; }
.tab-pane iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* === RESPONSIVE === */
@media (max-width: 768px) {
    .split-container { display: none; }
    .mobile-tabs { display: flex; }
    .upload-btn { top: calc(52px + env(safe-area-inset-top)); left: 12px; width: 44px; height: 44px; font-size: 20px; border-radius: 12px; }
    .session-bar { display: none; }
}
@media (min-width: 769px) {
    .split-container { display: flex; }
    .mobile-tabs { display: none; }
}

/* Iframe overlay to prevent stealing mouse during divider drag */
.drag-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    display: none;
}
.dragging .drag-overlay { display: block; }

/* Upload button — positioned in session bar on desktop */
.upload-btn {
    position: fixed;
    top: 46px;
    left: 4px;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(26, 26, 46, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--text-muted);
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    transition: all 0.15s;
}
.upload-btn:hover {
    background: rgba(124, 92, 191, 0.25);
    border-color: var(--accent);
    color: var(--text);
}

/* Full-screen drop catcher — sits above iframes, only visible during file drag */
.drop-catcher {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 9999;
    display: none;
    background: rgba(124, 92, 191, 0.12);
    border: 3px dashed var(--accent);
    align-items: center;
    justify-content: center;
}
.drop-catcher.active {
    display: flex;
}
.drop-catcher .drop-label {
    background: rgba(13, 13, 26, 0.92);
    color: var(--text);
    padding: 20px 40px;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    pointer-events: none;
}

/* Upload toast */
.upload-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(13, 13, 26, 0.95);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 10000;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
}
.upload-toast.visible { opacity: 1; }

/* === Public mode: keep desktop split layout, hide chrome that requires auth.
       Mobile public-mode stays dashboard-only (no fake terminal on phones).
       Divider stays visible on desktop so visitors can resize the split. === */
body.public-mode .dash-bar,
body.public-mode .upload-btn,
body.public-mode #journalFrame,
body.public-mode #filesFrame {
    display: none !important;
}
body.public-mode .tab-bar { display: none; }
body.public-mode .tab-content { margin-top: 0; }
body.public-mode #mobileDashboard { display: block; }
body.public-mode #mobileTerminal,
body.public-mode #mobileSettings {
    display: none !important;
}

/* Mobile (max-width: 768px): collapse the split — show only the dashboard pane. */
@media (max-width: 768px) {
    body.public-mode .pane-terminal { display: none; }
    body.public-mode .pane-dashboard { flex: 1 1 100%; width: 100%; }
}

/* Fake Claude Code styling (used only in public mode, lives inside .pane-terminal) */
.cc-fake {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #161618;
    color: #ececec;
    font-family: 'Berkeley Mono', 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    font-size: 13.5px;
    line-height: 1.65;
    overflow: hidden;
}
.cc-fake .cc-fake-content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 24px 26px 14px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;   /* start at the top; visitor scrolls down to read */
}
.cc-fake .cc-banner { color: #9ca3af; margin-bottom: 14px; }
.cc-fake .cc-mark   { color: #d97757; }   /* ◆ */
.cc-fake .cc-dim    { color: #9ca3af; }
.cc-fake .cc-prompt { color: #d97757; font-weight: 600; }
.cc-fake .cc-user   { color: #cdcdd2; }   /* user input — slightly brighter than response body */
.cc-fake .cc-row    { margin: 10px 0; }
.cc-fake .cc-p      { margin: 0 0 10px; color: #a8a8b0; }   /* Claude Code chat body gray */
.cc-fake .cc-tool   { color: #9ca3af; padding-left: 4px; margin: 2px 0; }
.cc-fake .cc-file   { color: #d6d6dc; }
.cc-fake .cc-cursor-row { margin-top: 16px; }
.cc-fake .cc-cursor { color: #cdcdd2; }

/* Bottom status bars — mimic Claude Code's permission line + tmux session bar */
.cc-fake .cc-statusbar {
    flex: 0 0 auto;
    padding: 4px 14px;
    font-size:12px;
    color: #9ca3af;
    background: #1a1a1d;
    border-top: 1px solid #2a2a2e;
    font-family: 'Berkeley Mono', 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.cc-fake .cc-statusbar.cc-warn {
    background: #2a1f12;
    color: #d97757;
}
.cc-fake .cc-statusbar-link {
    color: inherit;
    text-decoration: none;
    display: block;
    width: 100%;
}
.cc-fake .cc-statusbar-link:hover {
    text-decoration: underline;
    filter: brightness(1.1);
}
</style>
</head>
<body class="{{ 'public-mode' if view_mode == 'public' else '' }}" data-view-mode="{{ view_mode }}">
<script>window.VIEW_MODE = "{{ view_mode }}"; window.ACTIVE_VIEW = "{{ active_view }}";</script>
<script src="{{ v_static('js/mini-notes.js') }}" defer></script>

<!-- Desktop: side-by-side -->
<div class="split-container" id="splitContainer">
    <div class="pane pane-terminal" id="paneTerminal">
        <div class="drag-overlay"></div>
        {% if view_mode == 'authed' %}
        <div class="session-bar" id="desktopSessionBar"></div>
        <!-- scrolling="no": xterm scrolls its own buffer; the iframe document
             otherwise overflows by a few px and paints a stray scrollbar
             against the divider. -->
        <iframe id="terminalFrame" scrolling="no"></iframe>
        <!-- Terminal notes — bugs/ideas for the terminal, filed to dev notes
             under the 'terminal' tab (same store the PWA 📝 writes to). -->
        <button id="termNotesBtn" title="Terminal notes" style="position:absolute;top:46px;right:12px;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:rgba(26,26,46,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--text-muted);font-size:16px;cursor:pointer;z-index:50">&#128221;</button>
        <div id="termNotesPanel" style="display:none;position:absolute;top:86px;right:12px;z-index:51;width:min(340px,80%);background:#16162a;border:1px solid rgba(124,92,191,0.5);border-radius:12px;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,0.5);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
            <div style="display:flex;gap:6px;align-items:flex-start">
                <textarea id="termNoteInput" rows="2" placeholder="Bug or idea for the terminal…" style="flex:1;padding:8px 10px;border:1px solid #2a2a4a;border-radius:8px;background:#0d0d1a;color:#e0d0ff;font-size:13px;font-family:inherit;resize:none"></textarea>
                <button onclick="addTermNote()" style="min-height:40px;padding:0 14px;border:none;border-radius:8px;background:#7c5cbf;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Add</button>
            </div>
            <div id="termNotesList" style="max-height:40vh;overflow-y:auto;margin-top:8px;font-size:13px;color:#e0d0ff"></div>
        </div>
        <!-- Scheduled prompts — "tell it what to put in a specific terminal, and
             that terminal guns it at that time" (queue lives in
             scheduled_prompts.json; scripts/prompt_dispatcher.py, cron'd every
             minute, is what actually fires a due job). -->
        <button id="schedBtn" title="Schedule a prompt" style="position:absolute;top:46px;right:52px;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:rgba(26,26,46,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--text-muted);font-size:16px;cursor:pointer;z-index:50">&#9200;</button>
        <div id="schedPanel" style="display:none;position:absolute;top:86px;right:12px;z-index:51;width:min(380px,88%);max-height:70vh;overflow-y:auto;background:#16162a;border:1px solid rgba(124,92,191,0.5);border-radius:12px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,0.5);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;color:#e0d0ff">
            <div style="font-size:13px;font-weight:700;margin-bottom:8px">&#9200; Schedule a prompt</div>
            <div style="display:flex;flex-direction:column;gap:8px">
                <select id="schedSessionSelect" style="min-height:40px;padding:0 10px;border:1px solid #2a2a4a;border-radius:8px;background:#0d0d1a;color:#e0d0ff;font-size:13px;font-family:inherit"></select>
                <input id="schedNewSessionInput" type="text" placeholder="new-session-name" maxlength="30" style="display:none;min-height:40px;padding:0 10px;border:1px solid #2a2a4a;border-radius:8px;background:#0d0d1a;color:#e0d0ff;font-size:13px;font-family:inherit">
                <textarea id="schedPromptInput" rows="3" placeholder="What should it do?" style="padding:8px 10px;border:1px solid #2a2a4a;border-radius:8px;background:#0d0d1a;color:#e0d0ff;font-size:13px;font-family:inherit;resize:vertical;min-height:40px"></textarea>
                <input id="schedAtInput" type="datetime-local" style="min-height:40px;padding:0 10px;border:1px solid #2a2a4a;border-radius:8px;background:#0d0d1a;color:#e0d0ff;font-size:13px;font-family:inherit;color-scheme:dark">
                <button id="schedAddBtn" onclick="addScheduledPrompt()" style="min-height:40px;padding:0 14px;border:none;border-radius:8px;background:#7c5cbf;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Add</button>
            </div>
            <div id="schedJobsList" style="margin-top:10px;font-size:13px"></div>
        </div>
        {% else %}
        <div class="cc-fake" id="ccFake">
            <div class="cc-fake-content">
                <div class="cc-banner"><span class="cc-mark">◆</span> Claude Code <span class="cc-dim">· ~/exocortex · v{{ app_version }}</span></div>
                <div class="cc-row"><span class="cc-prompt">&gt;</span> <span class="cc-user">what is this site</span></div>

                {{ public_intro_html|safe }}

                <div class="cc-row cc-cursor-row"><span class="cc-prompt">&gt;</span> <span class="cc-cursor">▎</span></div>
            </div>
            <div class="cc-statusbar cc-warn"><a href="/about" target="_top" class="cc-statusbar-link">read more about my project here</a></div>
            <div class="cc-statusbar">▼ ~/exocortex &nbsp;·&nbsp; claude-opus-4-7 &nbsp;·&nbsp; tmux: chat</div>
        </div>
        {% endif %}
    </div>
    <div class="divider" id="divider"></div>
    <div class="pane pane-dashboard" id="paneDashboard">
        <div class="drag-overlay"></div>
        <div class="dash-bar" id="desktopDashBar">
            <button class="active" data-dashview="dashboard" onclick="switchDashView('dashboard', this)">Dashboard</button>
            <button data-dashview="journal" onclick="switchDashView('journal', this)">Journal</button>
            <button data-dashview="research" onclick="switchDashView('research', this)">Research</button>
            <button data-dashview="settings" onclick="switchDashView('settings', this)" title="Settings" aria-label="Settings" style="flex:0 0 36px;padding:11px 0;font-size:18px;margin-left:auto">&#9881;&#65038;</button>
        </div>
        <iframe src="/tab/{{ active_tab }}{% if item_name %}?item={{ item_name }}{% endif %}" id="dashboardFrame" allow="fullscreen; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        <iframe id="journalFrame" style="display:none"></iframe>
        <iframe id="researchFrame" style="display:none"></iframe>
        <iframe id="filesFrame" style="display:none"></iframe>
        <iframe id="settingsFrame" style="display:none"></iframe>
    </div>
</div>

<!-- Mobile: tabs -->
<div class="mobile-tabs" id="mobileTabs">
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="terminal" id="termTabBtn" onclick="switchTab('terminal')">Chat</button>
        <button class="tab-btn" data-tab="journal" onclick="switchTab('journal')">Journal</button>
        <button class="tab-btn" data-tab="dashboard" onclick="switchTab('dashboard')">Dashboard</button>
        <button class="tab-btn" data-tab="research" onclick="switchTab('research')">Research</button>
        <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')" title="Settings" aria-label="Settings" style="font-size:18px;flex:0 0 44px">&#9881;&#65038;</button>
    </div>
    <div class="session-menu" id="sessionMenu"></div>
    <div class="tab-content">
        <div class="tab-pane active" id="mobileTerminal">
            <iframe id="mobileTerminalFrame"></iframe>
        </div>
        <div class="tab-pane" id="mobileDashboard">
            <iframe id="mobileDashboardFrame" src="/tab/{{ active_tab }}{% if item_name %}?item={{ item_name }}{% endif %}" allow="fullscreen; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="tab-pane" id="mobileJournal">
            <iframe id="mobileJournalFrame"></iframe>
        </div>
        <div class="tab-pane" id="mobileResearch">
            <iframe id="mobileResearchFrame"></iframe>
        </div>
        <div class="tab-pane" id="mobileFiles">
            <iframe id="mobileFilesFrame"></iframe>
        </div>
        <div class="tab-pane" id="mobileSettings">
            <iframe id="mobileSettingsFrame"></iframe>
        </div>
    </div>
</div>

<!-- Camera button -->
<button class="upload-btn" id="uploadBtn" title="Upload file">
    &#128206;
</button>
<input type="file" id="fileInput" style="display:none">

<!-- Full-screen drop zone (above iframes) -->
<div class="drop-catcher" id="dropCatcher">
    <div class="drop-label">Drop file to upload</div>
</div>

<div class="upload-toast" id="uploadToast"></div>

<!-- Right-click context menu for custom tabs -->
<div class="ctx-menu" id="ctxMenu">
    <button id="ctxClose">Close session</button>
</div>

<script>
// === Dynamic session management ===
let desktopSession = localStorage.getItem('exo-desktop-session') || 'chat';
let currentSession = localStorage.getItem('exo-mobile-session') || 'chat';
let allSessions = [];
let defaultSessions = [];

function switchDesktopSession(session, btn) {
    desktopSession = session;
    currentSession = session;
    localStorage.setItem('exo-desktop-session', session);
    document.getElementById('terminalFrame').src = '/terminal/?arg=' + session;
    document.querySelectorAll('#desktopSessionBar .session-tab').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    fetch('/api/terminal/session', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session: session}),
    });
}

// === Context menu (desktop right-click) ===
const ctxMenu = document.getElementById('ctxMenu');
const ctxClose = document.getElementById('ctxClose');
let ctxTarget = null;

function showCtxMenu(x, y, sessionName) {
    ctxTarget = sessionName;
    ctxMenu.style.left = x + 'px';
    ctxMenu.style.top = y + 'px';
    ctxMenu.classList.add('open');
}
function hideCtxMenu() { ctxMenu.classList.remove('open'); ctxTarget = null; }
document.addEventListener('click', hideCtxMenu);
document.addEventListener('contextmenu', function(e) {
    if (!ctxMenu.contains(e.target)) hideCtxMenu();
});
ctxClose.onclick = function() {
    if (ctxTarget) removeSession(ctxTarget);
    hideCtxMenu();
};

function renderDesktopTabs() {
    const bar = document.getElementById('desktopSessionBar');
    bar.innerHTML = '';
    allSessions.forEach(s => {
        const isCustom = !defaultSessions.includes(s);
        const btn = document.createElement('button');
        btn.className = 'session-tab' + (s === desktopSession ? ' active' : '');
        btn.dataset.session = s;
        btn.onclick = function() { switchDesktopSession(s, this); };
        btn.textContent = s.charAt(0).toUpperCase() + s.slice(1);
        if (isCustom) {
            btn.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                showCtxMenu(e.clientX, e.clientY, s);
            });
            // Hover-visible × (desktop only, see @media (hover: none)) — same
            // close-session flow as the right-click menu, no duplicated fetch.
            const xSpan = document.createElement('span');
            xSpan.className = 'tab-close-x';
            xSpan.title = 'Close session';
            xSpan.textContent = '×';
            xSpan.onclick = function(e) {
                e.stopPropagation();
                removeSession(s);
            };
            btn.appendChild(xSpan);
        }
        bar.appendChild(btn);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'add-session-btn';
    addBtn.textContent = '+';
    addBtn.title = 'New session';
    addBtn.onclick = addSession;
    bar.appendChild(addBtn);
}

// === Long-press for mobile ===
let longPressTimer = null;
let longPressFired = false;

function renderMobileMenu() {
    const menu = document.getElementById('sessionMenu');
    menu.innerHTML = '';
    allSessions.forEach(s => {
        const isCustom = !defaultSessions.includes(s);
        const btn = document.createElement('button');
        btn.className = 'session-btn' + (s === currentSession ? ' active' : '');
        btn.textContent = s.charAt(0).toUpperCase() + s.slice(1);
        btn.onclick = function(e) {
            if (longPressFired) { longPressFired = false; return; }
            pickSession(s, this);
        };
        if (isCustom) {
            btn.addEventListener('touchstart', function(e) {
                longPressFired = false;
                longPressTimer = setTimeout(function() {
                    longPressTimer = null;
                    longPressFired = true;
                    removeSession(s);
                }, 600);
            }, {passive: true});
            btn.addEventListener('touchend', function() {
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
            });
            btn.addEventListener('touchmove', function() {
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
            });
        }
        menu.appendChild(btn);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'add-session-btn';
    addBtn.textContent = '+';
    addBtn.onclick = addSession;
    menu.appendChild(addBtn);
}

function applySessionData(data) {
    allSessions = data.sessions;
    defaultSessions = data.defaults;
    if (!allSessions.includes(desktopSession)) desktopSession = allSessions[0] || 'chat';
    if (!allSessions.includes(currentSession)) currentSession = allSessions[0] || 'chat';
    renderDesktopTabs();
    renderMobileMenu();
}

// SSE: live session updates from server
function connectSessionStream() {
    const es = new EventSource('/api/sessions/stream');
    es.onmessage = function(e) {
        try { applySessionData(JSON.parse(e.data)); } catch(err) {}
    };
    es.onerror = function() {
        es.close();
        // Reconnect after a few seconds
        setTimeout(connectSessionStream, 3000);
    };
}

async function loadSessions() {
    try {
        const resp = await fetch('/api/sessions');
        applySessionData(await resp.json());
    } catch(e) {
        applySessionData({sessions: ['chat', 'dev', 'other'], defaults: ['chat', 'dev', 'other']});
    }
}

async function addSession() {
    const name = prompt('Session name:');
    if (!name) return;
    const clean = name.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-').slice(0, 30);
    if (!clean) return;
    const resp = await fetch('/api/sessions', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name: clean}),
    });
    const data = await resp.json();
    if (!resp.ok) { alert(data.error); return; }
    allSessions = data.sessions;
    renderDesktopTabs();
    renderMobileMenu();
    // Auto-switch to the new session
    activateDesktopSession(clean);
}

// Switch to `session`'s desktop tab, re-querying for its button after the
// bar has actually rendered (rather than trusting a querySelector taken
// before/alongside a render) so the new tab reliably lands as active even
// if a render raced us.
function activateDesktopSession(session) {
    let btn = document.querySelector('#desktopSessionBar .session-tab[data-session="' + session + '"]');
    if (!btn) {
        renderDesktopTabs();
        btn = document.querySelector('#desktopSessionBar .session-tab[data-session="' + session + '"]');
    }
    switchDesktopSession(session, btn);
    if (btn) btn.classList.add('active');
}

async function removeSession(name) {
    if (!confirm('Close "' + name + '" session? This kills the tmux session.')) return;
    const resp = await fetch('/api/sessions', {
        method: 'DELETE',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name: name}),
    });
    const data = await resp.json();
    if (!resp.ok) { alert(data.error); return; }
    allSessions = data.sessions;
    renderDesktopTabs();
    renderMobileMenu();
    // If we just closed the active session, switch to first one
    if (desktopSession === name) {
        const first = allSessions[0] || 'chat';
        switchDesktopSession(first, document.querySelector('#desktopSessionBar .session-tab[data-session="' + first + '"]'));
    }
    if (currentSession === name) {
        const first = allSessions[0] || 'chat';
        pickSession(first, document.querySelector('.session-btn'));
    }
}

// Initial load — called once, handles both desktop and mobile, then starts SSE
async function initSessions() {
    if (window.VIEW_MODE !== 'authed') return;  // public visitors don't get terminal/sessions
    await loadSessions();
    document.getElementById('terminalFrame').src = '/terminal/?arg=' + desktopSession;
    document.getElementById('termTabBtn').textContent = currentSession.charAt(0).toUpperCase() + currentSession.slice(1);
    document.getElementById('mobileTerminalFrame').src = '/phone?session=' + currentSession;
    connectSessionStream();
}

// === Dashboard view switcher (Dashboard / Journal / Files / Settings) ===
// `skipPush` is set when the popstate handler (or initial-load activation) is
// driving this — the URL is already correct, so we must not push a new entry,
// and re-click affordances (which are only meaningful for a real click) are
// skipped too.
function switchDashView(view, btn, skipPush) {
    // Re-click Dashboard while it's already the active view → jump to the To Do
    // sub-tab inside the iframe. (No-op if the iframe is already on /tab/today.)
    if (view === 'dashboard' && !skipPush && btn && btn.classList.contains('active')) {
        const f = document.getElementById('dashboardFrame');
        if (f) {
            let cur = '';
            try { cur = f.contentWindow.location.pathname; } catch (e) {}
            if (cur !== '/tab/today') f.src = '/tab/today';
        }
        currentDashTab = 'today';
        if (location.pathname !== '/dashboard/today') {
            history.pushState({ tab: 'today' }, '', '/dashboard/today');
        }
        return;
    }
    document.getElementById('dashboardFrame').style.display = view === 'dashboard' ? 'block' : 'none';
    const jf = document.getElementById('journalFrame');
    jf.style.display = view === 'journal' ? 'block' : 'none';
    if (view === 'journal' && !jf.src.includes('/journal-view')) {
        jf.src = '/journal-view';
    }
    const rf = document.getElementById('researchFrame');
    rf.style.display = view === 'research' ? 'block' : 'none';
    if (view === 'research' && !rf.src) rf.src = '/research-view';
    const ff = document.getElementById('filesFrame');
    ff.style.display = view === 'files' ? 'block' : 'none';
    if (view === 'files' && !ff.src) ff.src = '/keeper';
    const sf = document.getElementById('settingsFrame');
    sf.style.display = view === 'settings' ? 'block' : 'none';
    if (view === 'settings' && !sf.src) sf.src = '/settings-view';
    document.querySelectorAll('#desktopDashBar button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    if (!skipPush) {
        const targetPath = view === 'journal' ? '/journal'
            : view === 'research' ? '/research'
            : view === 'files' ? '/files'
            : view === 'settings' ? '/settings'
            : (TAB_PATHS[currentDashTab] || '/dashboard/today');
        if (location.pathname !== targetPath) {
            history.pushState({ view: view }, '', targetPath);
        }
    }
}

// Callable from child iframes (dashboard / journal / files) to switch the
// right-pane view. Picks the right path automatically based on viewport.
function openSettingsTab() {
    if (window.matchMedia('(max-width: 768px)').matches) {
        switchTab('settings');
    } else {
        const btn = document.querySelector('#desktopDashBar [data-dashview="settings"]');
        switchDashView('settings', btn);
    }
}
function openDashboardTab() {
    if (window.matchMedia('(max-width: 768px)').matches) {
        switchTab('dashboard');
    } else {
        const btn = document.querySelector('#desktopDashBar [data-dashview="dashboard"]');
        switchDashView('dashboard', btn);
    }
}

// Theme broadcast: when settings saves, it postMessages the parent here. We
// fan out to every iframe so they refresh CSS vars without a hard reload.
window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || msg.type !== 'theme-changed' || !msg.overrides) return;
    const frames = [
        'dashboardFrame', 'journalFrame', 'researchFrame', 'filesFrame', 'settingsFrame',
        'mobileTerminalFrame', 'mobileDashboardFrame', 'mobileJournalFrame', 'mobileResearchFrame', 'mobileFilesFrame', 'mobileSettingsFrame',
    ];
    for (const id of frames) {
        const f = document.getElementById(id);
        if (f && f.contentWindow && f.contentWindow !== e.source) {
            f.contentWindow.postMessage({ type: 'theme-changed', overrides: msg.overrides }, '*');
        }
    }
});

// === Upload logic ===
const uploadBtn = document.getElementById('uploadBtn');
const fileInput = document.getElementById('fileInput');
const dropCatcher = document.getElementById('dropCatcher');
const uploadToast = document.getElementById('uploadToast');
let toastTimer = null;

function showToast(msg, ms) {
    clearTimeout(toastTimer);
    uploadToast.textContent = msg;
    uploadToast.classList.add('visible');
    toastTimer = setTimeout(() => uploadToast.classList.remove('visible'), ms || 2500);
}

async function uploadFile(file) {
    if (!file) return;
    showToast('Uploading...', 10000);
    const formData = new FormData();
    formData.append('photo', file);
    try {
        const resp = await fetch('/api/terminal/upload', { method: 'POST', body: formData });
        if (!resp.ok) {
            const text = await resp.text();
            showToast('Upload failed: ' + resp.status + ' — ' + (text.slice(0, 80) || 'unknown error'), 5000);
            return;
        }
        const data = await resp.json();
        if (data.path) {
            await fetch('/api/terminal/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text: '[uploaded: ' + data.path + ']', enter: false, session: window.innerWidth > 768 ? desktopSession : currentSession}),
            });
            showToast('Uploaded — path pasted into terminal', 3000);
        } else {
            showToast('Upload error: ' + JSON.stringify(data), 4000);
        }
    } catch (e) {
        showToast('Upload failed: ' + e.message, 4000);
    }
}

// Camera button — click to pick file
uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
        uploadFile(fileInput.files[0]);
        fileInput.value = '';
    }
});

// === Drag and drop ===
// The trick: we can't detect drag events over iframes, but the browser DOES fire
// dragenter/dragleave on the top-level window when a file enters from outside.
// As soon as we detect it, we show the drop-catcher (full-screen, above iframes)
// which then receives all subsequent dragover/drop events.

let dragEnterTarget = null;

document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    // Only activate for file drags
    if (!e.dataTransfer.types.includes('Files')) return;
    dragEnterTarget = e.target;
    dropCatcher.classList.add('active');
});

// dragleave fires on the document when leaving the window — but also when
// entering child elements. We only hide when leaving the drop-catcher itself.
dropCatcher.addEventListener('dragleave', (e) => {
    // Only hide if we actually left the drop catcher (not entering a child)
    if (e.target === dropCatcher) {
        dropCatcher.classList.remove('active');
    }
});

dropCatcher.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
});

dropCatcher.addEventListener('drop', (e) => {
    e.preventDefault();
    dropCatcher.classList.remove('active');
    if (e.dataTransfer.files.length) {
        uploadFile(e.dataTransfer.files[0]);
    }
});

// Paste from clipboard (Cmd+V / Ctrl+V)
document.addEventListener('paste', (e) => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
        if (item.kind === 'file') {
            e.preventDefault();
            uploadFile(item.getAsFile());
            return;
        }
    }
});

// === Tab switching (mobile) ===
const sessionMenu = document.getElementById('sessionMenu');
const termTabBtn = document.getElementById('termTabBtn');

// `skipPush` (see switchDashView) — driven by popstate/initial-load, URL is
// already correct, don't push and skip the re-tap affordances.
function switchTab(tab, skipPush) {
    if (tab === 'terminal') {
        const isAlreadyActive = termTabBtn.classList.contains('active');
        if (isAlreadyActive && !skipPush) {
            const opening = !sessionMenu.classList.contains('open');
            sessionMenu.classList.toggle('open');
            termTabBtn.classList.toggle('menu-open', opening);
            return;
        }
    }
    // Re-tap mobile Dashboard while it's already active → jump to To Do inside.
    if (tab === 'dashboard' && !skipPush) {
        const dashBtn = document.querySelector('.tab-btn[data-tab="dashboard"]');
        if (dashBtn && dashBtn.classList.contains('active')) {
            const f = document.getElementById('mobileDashboardFrame');
            if (f) {
                let cur = '';
                try { cur = f.contentWindow.location.pathname; } catch (e) {}
                if (cur !== '/tab/today') f.src = '/tab/today';
            }
            currentDashTab = 'today';
            if (location.pathname !== '/dashboard/today') {
                history.pushState({ tab: 'today' }, '', '/dashboard/today');
            }
            return;
        }
    }
    sessionMenu.classList.remove('open');
    termTabBtn.classList.remove('menu-open');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.getElementById('mobileTerminal').classList.toggle('active', tab === 'terminal');
    document.getElementById('mobileJournal').classList.toggle('active', tab === 'journal');
    document.getElementById('mobileResearch').classList.toggle('active', tab === 'research');
    document.getElementById('mobileDashboard').classList.toggle('active', tab === 'dashboard');
    document.getElementById('mobileFiles').classList.toggle('active', tab === 'files');
    document.getElementById('mobileSettings').classList.toggle('active', tab === 'settings');

    // Lazy-load the markdown journal iframe the first time it's opened
    if (tab === 'journal') {
        const jf = document.getElementById('mobileJournalFrame');
        if (jf && !jf.src) jf.src = '/journal-view';
    }
    if (tab === 'research') {
        const rf = document.getElementById('mobileResearchFrame');
        if (rf && !rf.src) rf.src = '/research-view';
    }
    if (tab === 'files') {
        const ff = document.getElementById('mobileFilesFrame');
        if (ff && !ff.src) ff.src = '/keeper';
    }
    if (tab === 'settings') {
        const sf = document.getElementById('mobileSettingsFrame');
        if (sf && !sf.src) sf.src = '/settings-view';
    }

    // Tell iframes whether they're active so they can manage focus
    const termFrame = document.getElementById('mobileTerminalFrame');
    if (termFrame && termFrame.contentWindow) {
        termFrame.contentWindow.postMessage({ type: 'tabActive', active: tab === 'terminal' }, '*');
    }

    // Terminal never gets a URL of its own — leave the address bar as-is.
    if (!skipPush && tab !== 'terminal') {
        const targetPath = tab === 'journal' ? '/journal'
            : tab === 'research' ? '/research'
            : tab === 'files' ? '/files'
            : tab === 'settings' ? '/settings'
            : (TAB_PATHS[currentDashTab] || '/dashboard/today');
        if (location.pathname !== targetPath) {
            history.pushState({ tab: tab }, '', targetPath);
        }
    }
}

function pickSession(session, btn) {
    currentSession = session;
    localStorage.setItem('exo-mobile-session', session);
    sessionMenu.classList.remove('open');
    termTabBtn.classList.remove('menu-open');
    termTabBtn.textContent = session.charAt(0).toUpperCase() + session.slice(1);
    document.getElementById('mobileTerminalFrame').src = '/phone?session=' + session;
    fetch('/api/terminal/session', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session: session}),
    });
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'terminal'));
    document.getElementById('mobileTerminal').classList.add('active');
    document.getElementById('mobileDashboard').classList.remove('active');
    document.getElementById('mobileNotes').classList.remove('active');
    document.querySelectorAll('.session-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
}

// Kick off session init
initSessions();

// === Terminal notes (desktop) — same dev-notes 'terminal' tab as the PWA ===
const _tnBtn = document.getElementById('termNotesBtn');
const _tnPanel = document.getElementById('termNotesPanel');
if (_tnBtn) {
    _tnBtn.addEventListener('click', () => {
        const open = _tnPanel.style.display !== 'none';
        _tnPanel.style.display = open ? 'none' : 'block';
        if (!open) {
            const sp = document.getElementById('schedPanel');
            if (sp) sp.style.display = 'none';   // only one floating panel open at a time
            loadTermNotes();
            document.getElementById('termNoteInput').focus();
        }
    });
    const _tnInput = document.getElementById('termNoteInput');
    if (_tnInput) {
        // Enter submits, Shift+Enter inserts a newline
        _tnInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                addTermNote();
            }
        });
        // Auto-expand while typing (same pattern as phone.html's #input)
        _tnInput.addEventListener('input', () => {
            _tnInput.style.height = 'auto';
            _tnInput.style.height = Math.min(_tnInput.scrollHeight, 160) + 'px';
        });
    }
}
// Click outside the panel (and not the 📝 trigger) dismisses it — same
// pattern as the journal calendar overlay.
document.addEventListener('click', (e) => {
    if (_tnPanel && _tnPanel.style.display !== 'none' && !_tnPanel.contains(e.target) && e.target !== _tnBtn) {
        _tnPanel.style.display = 'none';
    }
});
// Clicks inside the terminal iframe never bubble to this document — catch
// them via the window losing focus to the iframe. (Typed text survives:
// hiding the panel doesn't clear the textarea.)
window.addEventListener('blur', () => {
    if (_tnPanel && _tnPanel.style.display !== 'none') _tnPanel.style.display = 'none';
});

// === Scheduled prompts ("timers for starting code in the terminal") ===
// Panel lets Bradie queue a prompt for a session (existing or brand new) at a
// future date/time. The queue itself (scheduled_prompts.json) is managed by
// /api/terminal/schedule*; scripts/prompt_dispatcher.py (cron, every minute)
// is what actually types the prompt in when the time comes.
const _schedBtn = document.getElementById('schedBtn');
const _schedPanel = document.getElementById('schedPanel');
const _schedSessionSelect = document.getElementById('schedSessionSelect');
const _schedNewSessionInput = document.getElementById('schedNewSessionInput');
const _schedPromptInput = document.getElementById('schedPromptInput');
const _schedAtInput = document.getElementById('schedAtInput');
const _schedJobsList = document.getElementById('schedJobsList');

function _escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
        {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]
    ));
}

function _schedDefaultAt() {
    // Tomorrow 06:00 — "running before I wake up" is the whole point.
    const d = new Date();
    d.setDate(d.getDate() + 1);
    d.setHours(6, 0, 0, 0);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function _renderSchedSessionOptions() {
    if (!_schedSessionSelect) return;
    const prev = _schedSessionSelect.value;
    _schedSessionSelect.innerHTML = '';
    allSessions.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        _schedSessionSelect.appendChild(opt);
    });
    const newOpt = document.createElement('option');
    newOpt.value = '__new__';
    newOpt.textContent = '+ New session…';
    _schedSessionSelect.appendChild(newOpt);
    if (allSessions.includes(prev) || prev === '__new__') _schedSessionSelect.value = prev;
}

if (_schedSessionSelect) {
    _schedSessionSelect.addEventListener('change', () => {
        const isNew = _schedSessionSelect.value === '__new__';
        _schedNewSessionInput.style.display = isNew ? 'block' : 'none';
        if (isNew) _schedNewSessionInput.focus();
    });
}

if (_schedBtn) {
    _schedBtn.addEventListener('click', () => {
        const open = _schedPanel.style.display !== 'none';
        _schedPanel.style.display = open ? 'none' : 'block';
        if (!open) {
            if (_tnPanel) _tnPanel.style.display = 'none';   // only one floating panel open at a time
            _renderSchedSessionOptions();
            if (_schedAtInput && !_schedAtInput.value) _schedAtInput.value = _schedDefaultAt();
            loadScheduledPrompts();
        }
    });
}
// Same click-outside / window-blur dismiss pattern as the terminal notes panel.
document.addEventListener('click', (e) => {
    if (_schedPanel && _schedPanel.style.display !== 'none' && !_schedPanel.contains(e.target) && e.target !== _schedBtn) {
        _schedPanel.style.display = 'none';
    }
});
window.addEventListener('blur', () => {
    if (_schedPanel && _schedPanel.style.display !== 'none') _schedPanel.style.display = 'none';
});

function _schedSessionValue() {
    if (!_schedSessionSelect) return '';
    if (_schedSessionSelect.value === '__new__') {
        return (_schedNewSessionInput.value || '').trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
    }
    return _schedSessionSelect.value;
}

async function addScheduledPrompt() {
    const session = _schedSessionValue();
    const prompt = (_schedPromptInput.value || '').trim();
    const atRaw = _schedAtInput.value;
    if (!session) { alert('Pick or name a session.'); return; }
    if (!prompt) { alert('Prompt cannot be empty.'); return; }
    if (!atRaw) { alert('Pick a date and time.'); return; }
    let resp;
    try {
        resp = await fetch('/api/terminal/schedule/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({session, prompt, at: atRaw.replace('T', ' ')}),
        });
    } catch (e) { alert('Add failed: ' + e.message); return; }
    if (resp.status === 404) { alert('Schedule API not loaded yet — needs an app restart.'); return; }
    const data = await resp.json();
    if (!resp.ok) { alert(data.error || 'Could not schedule that.'); return; }
    _schedPromptInput.value = '';
    _schedAtInput.value = _schedDefaultAt();
    if (_schedSessionSelect.value === '__new__') _schedNewSessionInput.value = '';
    loadScheduledPrompts();
}

function _schedSnippet(text) {
    const s = String(text || '');
    return s.length > 90 ? s.slice(0, 90) + '…' : s;
}

function _renderSchedJobs(jobs) {
    if (!_schedJobsList) return;
    const pending = jobs.filter(j => j.status === 'pending');
    const rest = jobs.filter(j => j.status !== 'pending').slice(0, 8);
    if (!pending.length && !rest.length) {
        _schedJobsList.innerHTML = '<div style="color:var(--text-muted);padding:6px 0">No scheduled prompts yet.</div>';
        return;
    }
    let html = '';
    if (pending.length) {
        html += '<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin:2px 0 4px">Pending</div>';
        pending.forEach(j => {
            html += `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #2a2a4a">
                <div style="flex:1;min-width:0">
                    <div style="font-weight:600">${_escHtml(j.session)} <span style="font-weight:400;color:var(--text-muted)">&middot; ${_escHtml(j.at)}</span></div>
                    <div style="color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${_escHtml(_schedSnippet(j.prompt))}</div>
                </div>
                <button onclick="cancelScheduledPrompt('${_escHtml(j.id)}')" style="flex-shrink:0;min-height:40px;min-width:40px;padding:0 12px;border:1px solid #e74c3c;border-radius:8px;background:none;color:#e74c3c;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Cancel</button>
            </div>`;
        });
    }
    if (rest.length) {
        html += '<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin:10px 0 4px">Recent</div>';
        rest.forEach(j => {
            html += `<div style="padding:6px 0;border-bottom:1px solid #2a2a4a;opacity:0.55">
                <div>${_escHtml(j.session)} <span style="color:var(--text-muted)">&middot; ${_escHtml(j.at)} &middot; ${_escHtml(j.status)}</span></div>
                <div style="color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${_escHtml(_schedSnippet(j.prompt))}</div>
            </div>`;
        });
    }
    _schedJobsList.innerHTML = html;
}

async function loadScheduledPrompts() {
    let resp;
    try {
        resp = await fetch('/api/terminal/schedule');
    } catch (e) { return; }
    if (resp.status === 404) { alert('Schedule API not loaded yet — needs an app restart.'); return; }
    if (!resp.ok) return;
    const data = await resp.json();
    _renderSchedJobs(data.jobs || []);
}

async function cancelScheduledPrompt(id) {
    let resp;
    try {
        resp = await fetch('/api/terminal/schedule/cancel', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id}),
        });
    } catch (e) { alert('Cancel failed: ' + e.message); return; }
    if (resp.status === 404) { alert('Schedule API not loaded yet — needs an app restart.'); return; }
    const data = await resp.json();
    if (!resp.ok) { alert(data.error || 'Could not cancel that.'); return; }
    loadScheduledPrompts();
}

// Rows (with edit/delete) come from the shared mini-notes component.
// mini-notes.js now loads with `defer`, so it may not have run yet at this
// point in parsing — build _termNotes once it has (DOMContentLoaded fires
// after all deferred scripts finish), rather than calling createMiniNotes
// here at parse time.
const _termNotesList = document.getElementById('termNotesList');
let _termNotes = null;
function _initTermNotes() {
    _termNotes = (_termNotesList && typeof createMiniNotes === 'function') ? createMiniNotes(_termNotesList, 'terminal') : null;
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _initTermNotes);
} else {
    _initTermNotes();
}
function loadTermNotes() { if (_termNotes) _termNotes.load(); }

async function addTermNote() {
    const input = document.getElementById('termNoteInput');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    const r = await fetch('/api/devnote/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({tab: 'terminal', text}),
    });
    if (r.ok) { input.value = ''; loadTermNotes(); }
}

// === Draggable divider (desktop) ===
const split = document.getElementById('splitContainer');
const divider = document.getElementById('divider');
const paneL = document.getElementById('paneTerminal');
const paneR = document.getElementById('paneDashboard');

let dragging = false;

divider.addEventListener('mousedown', (e) => {
    e.preventDefault();
    dragging = true;
    divider.classList.add('active');
    split.classList.add('dragging');
});

document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const rect = split.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const total = rect.width;
    const divW = 6;
    const minPane = 200;

    let leftW = Math.max(minPane, Math.min(x - divW / 2, total - divW - minPane));
    let rightW = total - leftW - divW;

    paneL.style.flex = 'none';
    paneL.style.width = leftW + 'px';
    paneR.style.flex = 'none';
    paneR.style.width = rightW + 'px';
});

document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove('active');
    split.classList.remove('dragging');
});

// Save/restore divider position
function saveSplit() {
    if (paneL.style.width) {
        localStorage.setItem('exo-split', paneL.style.width);
    }
}
function restoreSplit() {
    const saved = localStorage.getItem('exo-split');
    if (saved) {
        const total = split.getBoundingClientRect().width;
        const leftW = parseInt(saved);
        if (leftW > 200 && leftW < total - 206) {
            paneL.style.flex = 'none';
            paneL.style.width = saved;
            paneR.style.flex = 'none';
            paneR.style.width = (total - leftW - 6) + 'px';
        }
    }
}

document.addEventListener('mouseup', saveSplit);
window.addEventListener('load', restoreSplit);
window.addEventListener('resize', () => {
    paneL.style.flex = '1';
    paneL.style.width = '';
    paneR.style.flex = '1';
    paneR.style.width = '';
});

// === Double-click divider to reset 50/50 ===
divider.addEventListener('dblclick', () => {
    paneL.style.flex = '1';
    paneL.style.width = '';
    paneR.style.flex = '1';
    paneR.style.width = '';
    localStorage.removeItem('exo-split');
});

// === Tab nav: keep URL in sync with the active dashboard tab without reloading the shell ===
const KNOWN_TABS = ['today', 'map', 'kitchen', 'inventory', 'money', 'car', 'meditation', 'media', 'movement', 'body', 'ideas', 'ecosystem', 'housing', 'people'];

// Canonical URL for each dashboard tab (routes/shell.py's /dashboard/<tab>).
const TAB_PATHS = {};
KNOWN_TABS.forEach(function (t) { TAB_PATHS[t] = t === 'today' ? '/dashboard/today' : '/dashboard/' + t; });

// Pre-migration paths — still live (they 302 server-side), kept here only so a
// stale history entry from before the migration still parses to the right tab.
const LEGACY_TAB_PATHS = { map: '/map', kitchen: '/kitchen', inventory: '/inventory', money: '/money', car: '/car-maintenance', housing: '/housing', meditation: '/meditation', media: '/media', movement: '/movement', body: '/body', ideas: '/ideas', ecosystem: '/ecosystem', people: '/people' };

// The dashboard tab currently loaded in the dashboard iframe(s) — tracked at the
// shell level so switching to/from Journal/Files/Settings and back can restore
// the right URL. Seeded from the tab the server rendered.
let currentDashTab = "{{ active_tab }}";

function tabFromPath(path) {
    if (path.startsWith('/item/buy/')) return 'inventory';
    if (path === '/') return 'today';
    if (path === '/dashboard') return 'today';
    const m = path.match(/^\/dashboard\/([^/]+)$/);
    if (m) return KNOWN_TABS.includes(m[1]) ? m[1] : 'today';
    for (const k in LEGACY_TAB_PATHS) if (LEGACY_TAB_PATHS[k] === path) return k;
    return 'today';
}

function dashIframes() {
    return [document.getElementById('dashboardFrame'), document.getElementById('mobileDashboardFrame')].filter(Boolean);
}

function journalIframes() {
    return [document.getElementById('journalFrame'), document.getElementById('mobileJournalFrame')].filter(Boolean);
}

function researchIframes() {
    return [document.getElementById('researchFrame'), document.getElementById('mobileResearchFrame')].filter(Boolean);
}

// A journal-side entity popover ("Open full file", or a keeper-file mention) asks
// us to open the Files tab (keeper memory) on a specific file. We load/navigate the
// keeper frame BEFORE flipping tabs so switchTab's lazy-load can't race us.
function openKeeperFile(path) {
    const isMobile = window.matchMedia('(max-width: 768px)').matches;
    const frame = document.getElementById(isMobile ? 'mobileFilesFrame' : 'filesFrame');
    if (frame) {
        if (!frame.getAttribute('src')) {
            frame.src = '/keeper#' + encodeURIComponent(path);   // lazy frame: land on the file
        } else {
            try { frame.contentWindow.postMessage({ type: 'keeper-open', path: path }, location.origin); }
            catch (e) { frame.src = '/keeper#' + encodeURIComponent(path); }
        }
    }
    if (isMobile) switchTab('files');
    else switchDashView('files', document.querySelector('#desktopDashBar [data-dashview="files"]'));
}

window.addEventListener('message', (e) => {
    if (e.origin !== location.origin) return;
    if (!e.data || e.data.type !== 'open-keeper' || !e.data.path) return;
    if (!journalIframes().some(f => f && f.contentWindow === e.source)) return;
    openKeeperFile(e.data.path);
});

function broadcastSwitchTo(name, extra) {
    dashIframes().forEach(f => {
        if (f && f.contentWindow) f.contentWindow.postMessage({ type: 'switchTo', name: name, extra: extra || null }, location.origin);
    });
}

window.addEventListener('message', (e) => {
    if (e.origin !== location.origin) return;
    if (!e.data || e.data.type !== 'tab') return;
    // Only accept from our dashboard iframes
    const fromDash = dashIframes().some(f => f && f.contentWindow === e.source);
    if (!fromDash) return;
    const name = e.data.name;
    const path = TAB_PATHS[name];
    if (!path) return;
    currentDashTab = name;
    if (location.pathname !== path) {
        history.pushState({ tab: name }, '', path);
    }
    broadcastSwitchTo(name, e.data.extra);
});

// Triage: a dashboard-side button (🧭 Triage) asks us to open the terminal pane
// on a session (the "todo" triage session). The spawn already happened
// server-side; we just refresh the session bar and switch the active terminal
// to it — desktop switches the left pane, mobile flips to the terminal tab.
window.addEventListener('message', async (e) => {
    if (e.origin !== location.origin) return;
    if (!e.data || e.data.type !== 'openTerminalSession') return;
    const fromOurs = [...dashIframes(), ...researchIframes()].some(f => f && f.contentWindow === e.source);
    if (!fromOurs) return;
    const name = e.data.name;
    await loadSessions();   // pull in the freshly-spawned session so its tab exists
    if (window.innerWidth > 768) {
        activateDesktopSession(name);
    } else {
        pickSession(name);
    }
});

window.addEventListener('popstate', () => {
    const path = location.pathname;
    const isMobile = window.matchMedia('(max-width: 768px)').matches;
    if (path === '/journal' || path === '/research' || path === '/files' || path === '/settings') {
        const view = path.slice(1);
        if (isMobile) {
            switchTab(view, true);
        } else {
            const btn = document.querySelector('#desktopDashBar [data-dashview="' + view + '"]');
            switchDashView(view, btn, true);
        }
        return;
    }
    const tab = tabFromPath(path);
    currentDashTab = tab;
    if (isMobile) {
        switchTab('dashboard', true);
    } else {
        const btn = document.querySelector('#desktopDashBar [data-dashview="dashboard"]');
        switchDashView('dashboard', btn, true);
    }
    broadcastSwitchTo(tab);
});

// === Initial-view activation: if the server rendered this page with a
// non-dashboard view active (i.e. /journal, /files, /settings), flip to it on
// load — reusing switchDashView/switchTab so the lazy iframe-src logic runs.
// The URL is already correct, so this must never push state. Mobile's default
// pane is Terminal for '/', which we leave alone (ACTIVE_VIEW is 'dashboard'
// there, so this block is a no-op). ===
document.addEventListener('DOMContentLoaded', () => {
    if (!window.ACTIVE_VIEW || window.ACTIVE_VIEW === 'dashboard') return;
    const isMobile = window.matchMedia('(max-width: 768px)').matches;
    if (isMobile) {
        switchTab(window.ACTIVE_VIEW, true);
    } else {
        const btn = document.querySelector('#desktopDashBar [data-dashview="' + window.ACTIVE_VIEW + '"]');
        switchDashView(window.ACTIVE_VIEW, btn, true);
    }
});

// === Close VS Code from the Files tab ===
async function closeVscodeFromTab(e) {
    if (e) { e.stopPropagation(); e.preventDefault(); }
    try {
        const r = await fetch('/api/vscode/stop', { method: 'POST' });
        if (!r.ok) throw new Error(r.status);
        showToast('VS Code closed', 2000);
        // Point the iframe at the launcher so the next Files tap shows it
        const df = document.getElementById('filesFrame');
        if (df) df.src = '/vscode';
        // If Files is currently visible, switch back to Dashboard
        const desktopFilesActive = document.querySelector('.dash-bar button[data-dashview="files"].active');
        if (desktopFilesActive) {
            const dashBtn = document.querySelector('.dash-bar button[data-dashview="dashboard"]');
            if (dashBtn) switchDashView('dashboard', dashBtn);
        }
    } catch (err) {
        showToast('Close failed', 2000);
    }
}

// Long-press on the desktop Files tab: hold ~600ms to close VS Code
// (the mobile Files tab is gone — settings ⚙ lives there now)
function setupFilesLongPress() {
    document.querySelectorAll('.dash-bar button[data-dashview="files"]').forEach(btn => {
        let timer = null;
        let fired = false;
        const start = () => {
            fired = false;
            btn.classList.add('long-pressing');
            timer = setTimeout(() => {
                fired = true;
                btn.classList.remove('long-pressing');
                if (navigator.vibrate) navigator.vibrate(40);
                closeVscodeFromTab();
            }, 600);
        };
        const cancel = (e) => {
            btn.classList.remove('long-pressing');
            if (timer) { clearTimeout(timer); timer = null; }
            // If the long-press already fired, swallow the synthesized click
            if (fired && e && e.cancelable) e.preventDefault();
        };
        btn.addEventListener('touchstart', start, { passive: true });
        btn.addEventListener('touchmove', cancel);
        btn.addEventListener('touchend', cancel);
        btn.addEventListener('touchcancel', cancel);
    });
}
// The Files tab now opens the keeper memory browser, not VS Code — so the
// long-press-to-close-VS-Code affordance no longer applies. (VS Code itself is
// still reachable directly at /files/ if needed.) Left defined but not wired.
// setupFilesLongPress();

// === PWA service worker ===
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
}
</script>
